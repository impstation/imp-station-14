- type: inventoryTemplate
  id: planarian_split_tier3
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,3
    strippingWindowPos: 1,0
    displayName: Head
  - name: mask #they need to be able to smoke cigarettes
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 0,2
