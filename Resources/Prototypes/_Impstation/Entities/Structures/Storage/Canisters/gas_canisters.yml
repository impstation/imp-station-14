- type: entity
  parent: GasCanisterBrokenBase
  id: ElectrovaeCanisterBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: electrovae-1

- type: entity
  parent: GasCanisterBrokenBase
