- type: entity
  parent: GasCanister
  id: ElectrovaeCanister
  name: electrovae canister
  description: A canister that can contain any type of gas. This one is supposed to contain electrovae. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    layers:
    - state: electrovae
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
        Electrovae: 2769.36
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ElectrovaeCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Lock
    locked: true

