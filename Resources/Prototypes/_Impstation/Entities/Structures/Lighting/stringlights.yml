- type: entity
  name: string light
  description: "A string of lights that requires power to work. Standard lightbulbs fit in the sockets."
  id: PoweredStringLightEmpty
  suffix: Empty
  parent: PoweredSmallLightEmpty
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Wallmounts/Lighting/stringlight.rsi
    state: empty
    drawdepth: OverMobs
  - type: PointLight
    enabled: false
    offset: "0, -0.5"
    radius: 2
    energy: 0.5
    softness: 1.5
  - type: Physics
    canCollide: false
  - type: Clickable
  - type: WallMount
  - type: InteractionOutline
  - type: Construction
    graph: LightStringFixture
    node: emptyStringLight

