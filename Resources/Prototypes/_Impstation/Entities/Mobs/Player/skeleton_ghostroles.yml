- type: entity
  parent: [BaseItem, Tier3Contraband]
  id: ClosetSkeletonEgg
  name: skeleton egg
  description: Trouble brewing.
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/egg.rsi
    state: white
  - type: TriggerOnLand
  - type: SpawnOnTrigger
    proto: ClosetSkeletonSpawner
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/desecration-02.ogg"
    positional: true
  - type: DeleteOnTrigger

- type: entity
  parent: MobAllulaloSkeletonPerson
  id: MobAllulaloSkeletonCloset
  name: closet skeleton
  suffix: Allulalo
  components:
  - type: GhostRole
    name: ghost-role-information-closet-skeleton-name
    description: ghost-role-information-closet-skeleton-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: RandomHumanoidAppearance

