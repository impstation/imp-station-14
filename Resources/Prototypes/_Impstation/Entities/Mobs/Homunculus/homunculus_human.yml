- type: entity
  id: HomunculusHuman
  suffix: Human
  parent: [ BaseHomunculus, AppearanceHomunculusHuman]
  description: A wet chunk of synthetic flesh. It's alive.
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Homunculi/Human/body.rsi/
    state: base
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: UnisexHuman
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: -6
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.3
    baseSprintSpeed : 0.5

  - type: Tag
    tags:
    - FootstepSound
    - VimPilot
    - DoorBumpOpener
