- type: entity
  id: HomunculusMoth
  suffix: Moth
  parent: [ BaseHomunculus, AppearanceHomunculusMoth]
  description: It's... Fluffy? I think?
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 150
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: MothAccent
  - type: ZombieAccentOverride
    accent: zombieMoth
  - type: Speech
    speechVerb: Moth
    allowedEmotes: [ 'Chitter', 'Squeak' ]
  - type: TypingIndicator
    proto: moth
  - type: Vocal
    sounds:
      Male: MaleMoth
      Female: FemaleMoth
      Unsexed: UnisexMoth
  - type: Flammable
    damage:
      types:
        Heat: 4.5 # moths burn more easily
  - type: TemperatureDamage # Moths hate the heat and thrive in the cold.
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 0.05 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 3 #per second, scales with temperature & other constants
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureSpeed
    thresholds:
      289: 0.8
      275: 0.6
      250: 0.4
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: -6
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.4
    baseSprintSpeed : 0.6
  - type: Tag
    tags:
    - FootstepSound
    - VimPilot
    - DoorBumpOpener
