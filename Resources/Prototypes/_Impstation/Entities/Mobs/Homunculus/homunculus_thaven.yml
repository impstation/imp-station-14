- type: entity
  id: HomunculusThaven
  suffix: Thaven
  parent: [ BaseHomunculus, AppearanceHomunculusThaven ]
  description: You'll witness before you a phenomenon like no other; a thaven of the sea...
  components:
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodThavenMeat
      amount: 5
  - type: ThavenMoods
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: ShimmeringBlood
        Quantity: 150
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
  - type: StaminaDamageOnHit
    damage: 18
  - type: Vocal
    sounds:
      Male: MaleThaven
      Female: FemaleThaven
      Unsexed: UnisexThaven
  - type: TypingIndicator
    proto: thaven # DeltaV unique typing indicator
  - type: NoContractionsAccent
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/Footsteps/slime1.ogg
      params:
        volume: -6
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.8
    baseSprintSpeed : 1
    friction: 0.9
  - type: Tag
    tags:
    - FootstepSound
    - VimPilot
    - DoorBumpOpener
