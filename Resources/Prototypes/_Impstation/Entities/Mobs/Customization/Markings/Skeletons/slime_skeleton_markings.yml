# Eyes

- type: marking
  id: SlimeSkeletonEyes
  bodyPart: HeadTop
  groupWhitelist: [ SlimeSkeleton ]
  forcedColoring: false
  coloring:
    default:
      type:
        !type:SimpleColoring
        color: "#ff65ad"
  sprites:
  - sprite: _Impstation/Mobs/Customization/Skeletons/SlimeSkeleton/eyes.rsi
    state: eyes
  shader: unshaded


