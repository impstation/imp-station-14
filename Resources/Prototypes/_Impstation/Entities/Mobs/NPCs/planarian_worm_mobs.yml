- type: entity
  name: bloodworm
  parent: [ BaseMobBloodwormBody, SimpleMobBase ]
  id: MobPlanarianBloodworm
  description: The bloodworm is one of the basic building blocks of the Planarian circulatory system. Diligently delivered by the Heartworm, these little guys provide oxygen for the Planarian body. Unfortunately, they're not fit for life outside the Planarian body, and quickly pass away when separated from their host. This one is about to die.
  components:
    - type: VentCrawler
      enterDelay: 1
    - type: Item
      size: Tiny
    - type: Sprite
      drawdepth: Mobs
      sprite: _Impstation/Mobs/Animals/Planarian_Mobs/bloodworm.rsi
      state: bloodworm
    - type: NpcFactionMember
      factions:
        - Passive
    - type: InputMover
    - type: MobMover
    - type: NPCImprintingOnSpawnBehaviour #lets be blood with mama
      spawnFriendsSearchRadius: 3
      whitelist:
        tags:
        - Planarian
    - type: HTN
      rootTask:
        task: KisserTomatoCompound #follows but doesnt attack
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.15
          density: 10 #blood is really light i carry it all the time
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: MobThresholds
      thresholds:
        0: Alive
        5: Dead
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 5
        behaviors:
        - !type:GibBehavior
          recursive: false
        - !type:PlaySoundBehavior
          sound:
            collection: desecration
    - type: TriggerOnMobstateChange
      mobState:
      - Dead
    - type: EmitSoundOnTrigger
      sound:
        collection: desecration
        params:
          variation: 0.125
          volume: -16 #a lot of these will play at once
    - type: MeleeWeapon
      altDisarm: false
      angle: 0
      animation: WeaponArcPunch
      damage:
        types:
          Blunt: 1
    - type: Speech
      speechSounds: Planarian
      speechVerb: Planarian
      allowedEmotes: ['Squeak', 'GoblinMutter']
    - type: Vocal
      sounds:
        Male: UnisexBloodworm
        Female: UnisexBloodworm
        Unsexed: UnisexBloodworm
      wilhelmProbability: 0.001
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
        - ReagentId: Blood #planarians have planarian blood, but the bloodworms in their body have blood blood
          Quantity: 1
    - type: InteractionPopup
      successChance: 0.2
      interactSuccessString: petting-success-bloodworm
      interactFailureString: petting-failure-bloodworm
    - type: NoSlip
    - type: ZombieImmune
    - type: Edible
    - type: NPCRetaliation
    - type: CanEscapeInventory
      baseResistTime: 2
    - type: AlwaysRevolutionaryConvertible #imp

- type: entity
  name: email worm
  id: MobPlanarianEmailworm
  parent: MobSpaceBasic
  description: A purely parasitic Planarian organ, it spreads itself through hazardous emails and other forms of digital communication. Extremely hostile upon removal from its host, though it seems to spare Planarians, perhaps in an attempt to find sympathy in a new host.
  components:
    - type: Sprite
      drawdepth: Mobs
      sprite: _Impstation/Mobs/Animals/Planarian_Mobs/emailworm.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: emailworm_alive
        - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
          state: emailworm_alive-unshaded
          shader: unshaded
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepSnake
    - type: NpcFactionMember
      factions:
        - Planarian
    - type: MobThresholds
      thresholds:
        0: Alive
        25: Critical
        45: Dead
    - type: Stamina
      baseCritThreshold: 150
    - type: DamageStateVisuals
      states:
        Alive:
          Base: emailworm_alive
          BaseUnshaded: emailworm_alive-unshaded
        Critical:
          Base: emailworm_crit
          BaseUnshaded: emailworm_crit-unshaded
        Dead:
          Base: emailworm_dead
          BaseUnshaded: emailworm_dead-unshaded
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 90
        behaviors:
        - !type:GibBehavior
          recursive: false
    - type: Butcherable #PLANARIAN TODO: special drop? emailskin boots?
      spawned:
        - id: Envelope
          amount: 1
        - id: MailingUnitElectronics
          amount: 1
        - id: CableApcStack1
          amount: 2
        - id: PotatoAIChip
          amount: 1
          prob: 0.3
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
        - ReagentId: MalwareBytes #PLANARIAN TODO: email blood
          Quantity: 50
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.40
          density: 120
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: MeleeWeapon
      hidden: true
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        types:
          Piercing: 6
          Shock: 4
      altDisarm: false # imp
    - type: SolutionContainerManager
      solutions:
        melee:
          reagents:
          - ReagentId: MalwareBytes #far future todo: would be nice if hallucinations become a thing if these made popup ads appear on your screen
            Quantity: 90
    - type: MeleeChemicalInjector
      solution: melee
      transferAmount: 6
    - type: InteractionPopup
      successChance: 0.2
      interactSuccessString: petting-success-emailworm
      interactFailureString: petting-failure-emailworm
    - type: GhostOnMove
      mustBeDead: true
    - type: VentCrawler
      enterDelay: 2
    - type: Carriable
    - type: Speech
      speechSounds: Planarian
      speechVerb: Planarian
    - type: Vocal
      sounds:
        Male: UnisexPlanarian
        Female: UnisexPlanarian
        Unsexed: UnisexPlanarian
    - type: TypingIndicator
      proto: planarian
