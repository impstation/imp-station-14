  - type: Sprite
    sprite: _Impstation/Misc/cc/misc.rsi
    state: plushie_goldbug
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blune: 10
    soundHit:
      path: /Audio/Voice/Arachnid/arachnid_scream.ogg
    animation: WeaponArcBite
  - type: LandAtCursor
  - type: DamageOtherOnHit
    ignoreResistances: true
    damage:
      types:
        Blunt: 10
    staminaCost: 5
  - type: Item
    sprite: _Impstation/Misc/cc/misc.rsi
    inhandVisuals:
      left:
        - state: plushie_goldbug-inhand-left
      right:
        - state: plushie_goldbug-inhand-right
  - type: Edible
    requiresSpecialDigestion: false
    useSound:
      path: /Audio/Voice/Arachnid/arachnid_scream.ogg
  - type: GoobAbsorbable #delicious
    biomassRestored: 0.1
  - type: FlavorProfile
    flavors:
      - whimsy
  - type: Extractable
    grindableSolutionName: bugblood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Gold
          Quantity: 5
        - ReagentId: HeartbreakerToxin
          Quantity: 5
      bugblood:
        maxVol: 10
        reagents:
        - ReagentId: CopperBlood
          Quantity: 10
  - type: Clothing
    quickEquip: false
    sprite: _Impstation/Misc/cc/misc.rsi
    equippedPrefix: goldbug
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: goldbug-equipped-HELMET
        offset: "0, 0.06"

