- type: entity
  name: lemo pie
  parent: FoodPieBase
  id: FoodPieLemo
  description: A new spin on the classic. Makes you want to sing!
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - lemo
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/Baked/pie.rsi
    layers:
    - state: tin
    - state: lemo
  - type: SliceableFood
    count: 8
    slice: FoodPieLemoSlice
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 47.5
      - ReagentId: Sugar
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 6

- type: entity
  name: slice of lemo pie
  parent: FoodPieSliceBase
  id: FoodPieLemoSlice
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - lemo
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/Baked/pie.rsi
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: pink
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5.9375
      - ReagentId: Sugar
        Quantity: 0.625
      - ReagentId: Vitamin
        Quantity: 0.75
