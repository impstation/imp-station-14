# VIETNAM NUMBA ONE

- type: entity
  name: nem chua
  parent: FoodMealBase
  id: FoodNemChua
  description: A fermented raw pork dish from Space Vietnam.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: FlavorProfile
    flavors:
    - meaty
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/vietnam.rsi
    state: nemchua
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 11
        - ReagentId: Allicin
          Quantity: 1.33
        - ReagentId: CapsaicinOil
          Quantity: 3.33
        - ReagentId: TableSalt
          Quantity: 1.66
        - ReagentId: Nutriment
          Quantity: 5


- type: entity
