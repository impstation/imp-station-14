        maxVol: 69 #haha nice
        reagents:
        - ReagentId: Nutriment
          Quantity: 17
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: JuiceCarrot
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 17
        - ReagentId: CapsaicinOil
          Quantity: 10
