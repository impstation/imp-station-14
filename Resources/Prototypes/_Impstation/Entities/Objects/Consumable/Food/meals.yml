- type: entity
  name: cha lua
  parent: FoodMealBase
  id: FoodChaLua
  description: Also known as Vietnamese Bologna.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: FlavorProfile
    flavors:
    - meaty
    ignoreReagents:
    - TableSalt
    - UncookedAnimalProteins
    - Allicin
    - Nutriment
    - Vitamin
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/vietnam.rsi
    state: cha-lua-whole
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 48
        reagents:
        - ReagentId: TableSalt
          Quantity: 10
        - ReagentId: UncookedAnimalProteins
          Quantity: 20
        - ReagentId: Allicin
          Quantity: 4
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 4
  - type: AtmosExposed
  - type: Temperature
    currentTemperature: 290
  - type: TemperatureDamage
  - type: InternalTemperature
    thickness: 0.02
    area: 0.02
  - type: SliceableFood
    count: 3
    slice: FoodChaLuaSlice
  - type: Construction
    graph: CookedChaLuaLog
    node: start
    defaultTarget: cooked cha lua

- type: entity
  name: cha lua slice
  parent: FoodMealBase
  id: FoodChaLuaSlice
  description: An uncooked slice of cha lua.
  components:
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/vietnam.rsi
    state: cha-lua-slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 3.33
        - ReagentId: Allicin
          Quantity: 1
        - ReagentId: Nutriment
          Quantity: 3.33
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: TableSalt
          Quantity: 3.33

- type: entity
  name: cooked cha lua slice
  parent: FoodMealBase
  id: FoodCookedChaLuaSlice
  description: A grilled slice of cha lua. Yum!
  components:
  - type: Tag
    tags:
    - Cooked
    - Cutlet
    - Meat
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/vietnam.rsi
    state: cha-lua-slice-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Protein
          Quantity: 3.33
        - ReagentId: Allicin
          Quantity: 1
        - ReagentId: Nutriment
          Quantity: 3.33
        - ReagentId: Vitamin
          Quantity: 1
        - ReagentId: TableSalt
          Quantity: 3.33
  - type: FoodSequenceElement
    entries:
      Burger: ChaLuaSlice
      Taco: ChaLuaSlice
      Hotdog: ChaLuaSlice

- type: entity
  name: cooked cha lua
  parent: FoodMealBase
  id: FoodCookedChaLua
  description: Why did you cook it this way?
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _Impstation/Objects/Consumable/Food/vietnam.rsi
    layers:
    - state: cha-lua-whole-cooked
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: TableSalt
          Quantity: 10
        - ReagentId: Protein
          Quantity: 20
        - ReagentId: Allicin
          Quantity: 4
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 4
  - type: SliceableFood
    count: 3
    slice: FoodCookedChaLuaSlice


