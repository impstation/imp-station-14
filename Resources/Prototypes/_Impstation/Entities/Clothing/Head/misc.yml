- type: entity
  parent: WaterDropletHat
  id: BoneWaterDropletHat
  name: bone droplet
  description: Talk about hard water!
  components:
  - type: Sprite
    sprite: _Impstation/Clothing/Head/Misc/bonedroplet.rsi
    state: icon
  - type: Item
    sprite: _Impstation/Clothing/Head/Misc/bonedroplet.rsi
    size: Tiny
    storedRotation: -90
  - type: FlavorProfile
    flavors:
      - milk
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 2
        reagents:
        - ReagentId: Milk
          Quantity: 2
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Voice/Skeleton/skeleton_scream.ogg
      - !type:SpillBehavior
        solution: drink
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
