# Please list new additions in this order: by TC price in its category, and if it has the same price as another item, then by alphabetical order by ID (not name).

- type: listing
  id: UplinkSingularityBeaconNukie
  name: uplink-singularity-beacon-name
  description: uplink-singularity-beacon-desc
  productEntity: SingularityBeacon
  discountCategory: usualDiscounts
  discountDownTo:
    Telecrystal: 4
  cost:
    Telecrystal: 12
  categories:
  - UplinkDisruption
  conditions:
  - !type:StoreWhitelistCondition
    makeHidden: true
    whitelist:
      tags:
      - NukeOpsUplink
  - !type:BuyerWhitelistCondition
    blacklist:
      components:
      - SurplusBundle

- type: listing
  id: UplinkAssaultPod
  name: uplink-assault-pod-name
  description: uplink-assault-pod-desc
  icon:
    sprite: _Goobstation/Effects/redspace_lifeline.rsi
    state: redspace_lifeline
  productEvent: !type:AssaultPodPurchasedEvent
  cost:
    Telecrystal: 40
  categories:
  - UplinkDisruption
  conditions:
  - !type:StoreWhitelistCondition
    makeHidden: true
    whitelist:
      tags:
      - NukeOpsUplink
  - !type:BuyerWhitelistCondition
    blacklist:
      components:
      - SurplusBundle
  - !type:ListingLimitedStockCondition
    stock: 1
  - !type:WarCondition
    afterWar: false
  globalListing: true
