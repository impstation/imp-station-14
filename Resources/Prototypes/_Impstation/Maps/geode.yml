- type: gameMap
  id: Geode
  mapName: 'Geode Outpost'
  mapPath: /Maps/_Impstation/geode.yml
  minPlayers: 8
  maxPlayers: 27
  stations:
    Geode:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Geode Outpost {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '-IMP-MS'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_cluster.yml
        - type: StationJobs
          availableJobs: # Total of 52 jobs roundstart, max of 61 inc. latejoins and trainees.
            # command - 8
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            HospitalityDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # service - 10
            Bartender: [ 2, 2 ]
            Botanist: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Chef: [ 1, 1 ]
            Clown: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            # engineering - 3-5
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 2, 2 ]
            TechnicalAssistant: [ 1, 1 ]
            # medical - 4-6
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 2, 2 ]
            MedicalIntern: [ 1, 1 ]
            Paramedic: [ 1, 1 ]
            Psychologist: [ 0, 0 ]
            # science - 4-6
            Borg: [ 2, 2 ]
            ResearchAssistant: [ 1, 1 ]
            Scientist: [ 2, 2 ]
            StationAi: [ 1, 1 ]
            # security - 4-6
            Brigmedic: [ 1, 1 ]
            Detective: [ 1, 1 ]
            Lawyer: [ 0, 0 ]
            SecurityCadet: [ 1, 1 ]
            SecurityOfficer: [ 2, 2 ]
            Warden: [ 1, 1 ]
            # supply - 4-6
            CargoTechnician: [ 2, 2 ]
            Courier: [ 1, 1 ]
            SalvageSpecialist: [ 2, 2 ]
            SupplyAssistant: [ 1, 1 ]
            # civilian
            Passenger: [ -1, -1 ]
