- type: reagent
  id: Electrovae
  name: reagent-name-electrovae
  desc: reagent-desc-electrovae
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#0022FF"
  recognizable: true
  boilingPoint: -116.1
  meltingPoint: -149.9
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 0.5
    Gas:
