  recognizable: true
  boilingPoint: -114.3
  meltingPoint: -142.8
  metabolisms:
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1.0
      - !type:Electrocute
        probability: 0.5
    Gas:
      effects:
      - !type:HealthChange
        scaling: true
        ignoreResistances: true
        damage:
          types:
            Poison: 0.15
      - !type:Electrocute
        probability: 0.5
