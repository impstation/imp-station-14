- type: reagent
  parent: Blood
  id: DinoBlood
  name: reagent-name-dino-blood
  group: Biological
  desc: reagent-desc-dino-blood
  flavor: piquant
  color: "#DC143C"
  recognizable: true
  physicalDesc: reagent-physical-desc-viscous
  metabolisms:
    # like a shitter omnizine, and a shittier ichor
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 1.5
    Medicine:
      effects:
      - !type:ModifyBloodLevel
        amount: 1
      - !type:HealthChange
        damage:
          groups:
            Burn: -1
            Toxin: -1
            Airloss: -1
            Brute: -1
      - !type:ModifyBleed
        amount: -1

- type: reagent
  parent: Blood
  id: AnomalocaridCopperBlood #mostly the same as normal copper blood but with a different color
  name: reagent-name-anomalocarid-blood
  group: Biological
  desc: reagent-desc-anomalocarid-blood
  flavor: fizzy
  color: "#18d6a7"
  recognizable: true
  physicalDesc: reagent-physical-desc-fizzy

- type: reaction
  id: AnomalocaridCopperBloodBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    AnomalocaridCopperBlood:
      amount: 20
  products:
    TableSalt: 10
    Copper: 1
    Sugar: 5
    Fat: 1
    EnergyDrink: 3 #there's a reason i promise

- type: reagent
  id: SynthFlesh
  name: reagent-name-synthflesh
  group: Biological
  desc: reagent-desc-synthflesh
  flavor: people
  color: "#FFC6C6"
  recognizable: true
  physicalDesc: reagent-physical-desc-alive
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          groups:
            Brute: -3
      - !type:HealthChange
        damage:
          types:
            Cellular: 2
      - !type:Vomit
        probability: 0.25
      - !type:Jitter
        probability: 0.25

- type: reaction
  id: SynthBloodBreakdown # synthblood under /_CD/Reagents/biological.yml
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    SynthBlood:
      amount: 5
  products:
    Silicon: 1
    Lithium: 1
    Ethanol: 2
    SpaceLube: 1

