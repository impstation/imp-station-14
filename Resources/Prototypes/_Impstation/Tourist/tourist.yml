- type: antag
  id: Tourist
  name: roles-tourist-name
  antagonist: false
  setPreference: false
  playTimeTracker: AntagTourist # this should probably just be tourist
  objective: roles-tourist-objective

- type: entity
  id: TouristRule
  parent: BaseGameRule
  components:
  - type: AntagSelection
    agentName: tourist-round-end-agent-name
    antags: 
    - !type:FixedAntagCount
      proto: Tourist
  - type: AntagRandomObjectives
    sets:
    - groups: TouristObjectiveGroups
    maxDifficulty: 5

- type: antagSpecifier
  id: Tourist
  parent: BaseAntagSpecifier
  prefRoles: [ Tourist ]
  mindRoles:
  - MindRoleTourist
