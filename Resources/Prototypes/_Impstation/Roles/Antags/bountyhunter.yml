- type: antag
  id: BountyHunter
  name: roles-antag-bounty-hunter-name
  antagonist: false
  setPreference: false
  playTimeTracker: AntagBountyHunter # imp
  objective: roles-antag-bounty-hunter-objective
  requirements: # Requiring some sec playtime, mainly to ensure people know escalation rules
  - !type:DepartmentTimeRequirement
    department: Security
    time: 5h

- type: startingGear
  id: BountyHunterGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorBlack
    head: ClothingHeadHatCowboyBountyHunter
    mask: ClothingMaskGasSecurity
    back: ClothingBackpackSatchel
    eyes: ClothingEyesBountyHunterGlasses
    outerClothing: ClothingOuterCoatBomber
    shoes: ClothingShoesBootsMercFilled
    gloves: ClothingHandsMercGlovesCombat
    id: BountyHunterPDA
    ears: ClothingHeadsetFreelance
    belt: ClothingBeltMercWebbing
    pocket1: BaseSeclinkRadio
    pocket2: BountyHunterGear
  storage:
    back:
    - WeaponRevolverInspector
    - SmokeGrenade
    - PhoneInstrumentBountyHunter

- type: antagSpecifier
  parent: RestrictedAntag
  id: BountyHunter
  multiAntagSetting: NotExclusive
  briefing:
    text: bounty-hunter-role-greeting
    color: Orange
  mindRoles:
  - MindRoleBountyHunter
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesBountyHunterTitle
    - NamesBountyHunter
    nameFormat: name-format-bounty-hunter
  - type: RandomHumanoidAppearance
    randomizeName: false
  startingGear: BountyHunterGear
  roleLoadout: 
  - RoleSurvivalEVA
