#### PLANARIAN SPLITS ####

# PLANARIAN SPLIT ORGANS #

- type: entity
  parent: [ OrganPlanarianLungs ]
  categories: [ HideSpawnMenu ]
  id: OrganPlanarianSplitLungs
  components:
  - type: TriggerOnGotRemovedFromContainer #the split organs shouldnt litter the floor
  - type: DeleteOnTrigger

- type: entity
  parent: [ OrganPlanarianHeart ]
  categories: [ HideSpawnMenu ]
  id: OrganPlanarianSplitHeart
  components:
  - type: TriggerOnGotRemovedFromContainer
  - type: DeleteOnTrigger

- type: entity
  parent: [ OrganPlanarianStomach ]
  categories: [ HideSpawnMenu ]
  id: OrganPlanarianSplitStomach
  components:
  - type: TriggerOnGotRemovedFromContainer
  - type: DeleteOnTrigger

- type: entity
  parent: [ OrganPlanarianLiver ]
  categories: [ HideSpawnMenu ]
  id: OrganPlanarianSplitLiver
  components:
  - type: TriggerOnGotRemovedFromContainer
  - type: DeleteOnTrigger

- type: entity
  parent: [ OrganPlanarianKidneys ]
  categories: [ HideSpawnMenu ]
  id: OrganPlanarianSplitKidneys
  components:
  - type: TriggerOnGotRemovedFromContainer
  - type: DeleteOnTrigger

# PLANARIAN SPLIT APPEARANCES/BODY #

- type: entity
  id: BasePlanarianSplitBody
  abstract: true
  components:
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganPlanarianSplitLungs
        - id: OrganPlanarianSplitHeart
        - id: OrganPlanarianSplitStomach
        - id: OrganPlanarianSplitLiver
        - id: OrganPlanarianSplitKidneys
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss:
          0.5
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.1

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearancePlanarianSplitTier1
  categories: [ HideSpawnMenu ] #imp
  name: Planarian split appearance
  components:
  - type: InitialBody
    organs:
      Brain: OrganPlanarian_Split1_BrainSplitting
      Lungs: OrganPlanarian_Split1_LungsSplitting

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearancePlanarianSplitTier2
  categories: [ HideSpawnMenu ] #imp
  name: Planarian split appearance
  components:
  - type: InitialBody
    organs:
      Brain: OrganPlanarian_Split2_BrainSplitting
      Lungs: OrganPlanarian_Split2_LungsSplitting

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearancePlanarianSplitTier3
  categories: [ HideSpawnMenu ] #imp
  name: Planarian split appearance
  components:
  - type: InitialBody
    organs:
      Brain: OrganPlanarianBrain
      Lungs: OrganPlanarianLungs

# PLANARIAN SPLIT MOBS #

- type: entity
  name: planarian split base
  parent: [BasePlanarianSplitBody, SimpleMobBase, StripableInventoryBase]
  abstract: true
  id: MobPlanarianSplit_Base
  description: A cut in half planarian. Yuck... its using its guts as legs...
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: planarian_split_tier1
      sprite: _Impstation/Mobs/Animals/Planarian_Mobs/splits.rsi
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Stripping
  - type: Puller
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PlanarianBlood
        Quantity: 80
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      60: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40 #they split on crit
      behaviors:
      - !type:GibBehavior
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 4.5
  - type: Grammar
    attributes:
      gender: epicene
  - type: Speech
    speechVerb: Planarian
    speechSounds: Planarian
    allowedEmotes: ['GoblinMutter',]
  - type: Vocal
    sounds:
      Male: UnisexPlanarian
      Female: UnisexPlanarian
      Unsexed: UnisexPlanarian
  - type: TransferMindOnGib
    targetTag: MindTransferTarget
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - Planarian
    - VimPilot
  - type: Emoting
  - type: Reform
    actionPrototype: PlanarianRegenerateActionTier1
    reformTime: 5 #planarians reform faster than diona
    popupText: planarian-regenerate-attempt
    reformPrototype: MobPlanarianReformed

- type: entity
  name: planarian half
  parent: [AppearancePlanarianSplitTier1, MobPlanarianSplit_Base]
  id: MobPlanarianSplit_1_Brain
  suffix: brain
  description: A cut in half planarian. Yuck... its using its guts as legs...
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: planarian_split_tier1
      sprite: _Impstation/Mobs/Animals/Planarian_Mobs/splits.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Inventory
    templateId: planarian_split_tier1
    displacements:
      belt:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier1_belt
      shoes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier1_feet
      hands:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier1_hands
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier1_jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier1_eyes
      ears:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Visitors/Ants/displacement.rsi  #they use the ant displacement to get rid of the ear slot visuals
            state: ears
      id:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Visitors/Ants/displacement.rsi  #they use the ant displacement to get rid of the ear slot visuals
            state: id
  - type: Hands #lost 1 hand in the divorce
    activeHandId: Right
    hands:
      Right:
        location: Right
  - type: ComplexInteraction
  - type: Stripping
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PlanarianBlood
        Quantity: 80
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      60: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40 #they split on crit
      behaviors:
      - !type:GibBehavior
  - type: Grammar
    attributes:
      gender: epicene
  - type: Vocal
    sounds:
      Male: UnisexPlanarianTier2
      Female: UnisexPlanarianTier2
      Unsexed: UnisexPlanarianTier2
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - Planarian
  - type: Reform
    actionPrototype: PlanarianRegenerateActionTier1
    reformTime: 5 #planarians reform faster than diona
    popupText: planarian-regenerate-attempt
    reformPrototype: MobPlanarianReformed

- type: entity
  name: planarian half
  parent: [MobPlanarianSplit_1_Brain]
  id: MobPlanarianSplit_1
  suffix: ghostrole
  description: A cut in half planarian. Yuck... its using its guts as legs...
