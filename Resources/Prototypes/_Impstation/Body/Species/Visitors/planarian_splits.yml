- type: entity
  name: planarian sliver
  parent: [ SimpleMobBase, AppearancePlanarianSplitTier3, BasePlanarianSplitBody]
  id: MobPlanarianSplit_3_Brain
  suffix: ghostrole
  description: The smallest a planarian can get before dying for good. You wouldn't hurt this... would you...?
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: planarian_split_tier3
      sprite: _Impstation/Mobs/Animals/Planarian_Mobs/splits.rsi
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 40
        restitution: 0.0
        mask:
        - MobMask
        layer: #they can go under doors, maybe some planarians will kill themselves and then regenerate on the other side of doors, but that would take so long i think it's fine
        - MobLayer
  - type: Inventory
    speciesId: planarian
    templateId: planarian_split_tier3
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier3_head
      mask:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Animals/Planarian_Mobs/split_displacements.rsi
            state: tier3_mask
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Critical
      20: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15 #they split on crit
      behaviors:
      - !type:GibBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          MobPlanarianBloodworm:
            min: 1
            max: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PlanarianBlood
        Quantity: 20
  - type: Speech
    speechVerb: Planarian
    speechSounds: Planarian
    allowedEmotes: ['GoblinMutter',]
  - type: Reform
    actionPrototype: PlanarianRegenerateActionTier3 #lower tiers take longer to get their regenerate ready
    reformTime: 12
    popupText: planarian-regenerate-attempt
    reformPrototype: MobPlanarianReformed
  - type: Vocal
    sounds:
      Male: UnisexPlanarianTier3
      Female: UnisexPlanarianTier3
      Unsexed: UnisexPlanarianTier3
  - type: CanEscapeInventory
    baseResistTime: 2
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - Planarian
    - VimPilot
    - RecyclerGibbable

- type: entity
  name: planarian sliver
  parent: [MobPlanarianSplit_3_Brain]
  id: MobPlanarianSplit_3
  description: The smallest a planarian can get before dying for good. You wouldn't hurt this... would you...?
  components:
