# RANDOM ORGANS

- type: entity
  parent: OrganPlanarianInternal
  id: OrganPlanarianEarthworm
  name: earth worm
  description: The earth worm is the Planarian organ that allows it to navigate its surroundings and balance itself. Looks familiar, somehow...
  components:
  - type: StationMap #globe helps you navigate
  - type: UserInterface
    interfaces:
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    key: enum.StationMapUiKey.Key
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi #imp edit, waiting on proper macro merge to migrate files
    state: earthworm
  - type: Item
    size: Small
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi
    inhandVisuals:
      left:
      - state: earthworm-inhand-left
      right:
      - state: earthworm-inhand-right

- type: entity
  parent: OrganPlanarianInternal
  id: OrganPlanarianPinworm
  name: pin worm
  description: While conventional wisdom suggests Planarians are invertebrates, the pin worm's bone-like structure raises questions about this assumption.
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi #imp edit, waiting on proper macro merge to migrate files
    state: pinworm
  - type: Item
    size: Small
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi
    inhandVisuals:
      left:
      - state: pinworm-inhand-left
      right:
      - state: pinworm-inhand-right
  - type: MeleeWeapon
    wideAnimationRotation: -100
    damage:
      types:
        Piercing: 5
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
    removalTime: 1.5
  - type: LandAtCursor
  - type: DamageOtherOnHit
    ignoreResistances: true
    damage:
      types:
        Piercing: 10
  - type: ThrowingAngle
    angle: -100

- type: entity
  parent: OrganPlanarianInternal
  id: OrganPlanarianWormwood
  name: worm wood
  description: Historically poached for its unique chemical properties, this woody growth seems to provide structure to the Planarian's internals, but its rarity among Planarians makes it unclear if this is truly an evolved organ or instead a symbiotic organism.
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi #imp edit, waiting on proper macro merge to migrate files
    state: wormwood
  - type: Item
    size: Small
