- type: entity
  parent:
  - AppearancePlanarian
  - BaseSpeciesMobOrganic
  id: MobPlanarian
  name: Urist McFlat
  components:
  - type: Damageable
    damageModifierSet: Planarian
  - type: Speech
    speechSounds: Planarian
    speechVerb: Planarian
    allowedEmotes: ['Squeak', 'GoblinMutter']
  - type: TypingIndicator
    proto: planarian
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PlanarianBlood #in the far future planarians grow blood of their own
        Quantity: 300 #still 300 because its funny to have a lot of blood
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      160: Dead
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/apid_brute_damage.rsi
        color: "#e0f715"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 #they split on crit
      behaviors:
      - !type:GibBehavior
      - !type:WeightedSpawnEntityBehavior
        weightedEntityTable: "RandomPlanarianOrganEntityTable" #some of their organs are silly and shouldnt always drop. surprises are fun!
        spawnOffset: 0.3
        minSpawn: 0
        maxSpawn: 1
        spawnAfter: 0.3
      - !type:SpawnEntitiesBehavior
        spawn:
          MobPlanarianBloodworm:
            min: 0
            max: 20 #theres a lot of blood inside of things
          FoodGummyWorm:
            min: 0
            max: 1
          OrganPlanarianWormwood:
            min: 0
            max: 1
          OrganPlanarianPinworm:
            min: 0
            max: 1
  - type: Vocal
    sounds:
      Male: UnisexPlanarian
      Female: UnisexPlanarian
      Unsexed: UnisexPlanarian
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Generic_mob_burning
    alternateState: Monkey_burning
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller #they r smaller (2) #they r smaller (3) #they r smaller (4)
        density: 50 #theyre woims
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSnake
    params:
      pitch: 2 #theyre smaller
      volume: -12 #should be quieter to be a little less annoying
  - type: NoSlip #theyre worms
  - type: Tag
    tags:
    - DoorBumpOpener
    - AnomalyHost
    - CanPilot
    - FootstepSound
    - Planarian

