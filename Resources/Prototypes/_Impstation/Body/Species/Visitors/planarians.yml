- type: entity
  parent: [ OrganBaseBrain, OrganPlanarianInternal ]
  id: OrganPlanarianBrain
  name: brain worm
  description: Research indicates Planarian brain worms are some of the most complex brains found in the various sentient species in Nanotrasen space, capable of managing an entire body of independent organ worms.
  suffix: Planarian, Brain

- type: entity
  parent: [ OrganPlanarianVisual, OrganBaseEyes, OrganPlanarianInternal ]
  id: OrganPlanarianEyes
  name: planarian eyes
  description: Planarian eyes have the ability to move independently of each other, and in some cases can even form lifelong feuds, refusing to ever look in the same spot as the other eye.

- type: entity
  parent: [ OrganBaseEars, OrganPlanarianInternal, BaseHandheldInstrument ]
  id: OrganPlanarianEars
  name: ear worm
  description: The rhythmic movements of ear worms allow Planarians to always maintain a steady beat. Planarian dancers are renowned for their improvisational abilities, and it's even rumored that Planarians were the first to invent "The Worm".
  suffix: Planarian, Ears
  components:
  - type: Item
    size: Small
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/organs.rsi
    inhandVisuals:
      left:
      - state: ears-inhand-left
      right:
      - state: ears-inhand-right
  - type: RandomWalk
    minStepCooldown: 1
    maxStepCooldown: 1 # theyre always on beat
    maxSpeed: 2
    minSpeed: 2
  - type: Instrument
    bank: 110 # Otamatone, defined in Impstation.sf2
    program: 6

- type: entity
  parent: [ OrganBaseAppendix, OrganPlanarianInternal]
  id: OrganPlanarianAppendix
  name: book worm
  description: The book worm is the record keeper of the Planarian body, and it diligently tracks vital statistics such as distance travelled, memories made, time spent alive, and total money lost in horse bets.
  suffix: Planarian, Appendix
  components:
  - type: Paper
    contentSize: 12000
  - type: PaperVisuals
    headerImagePath: "/Textures/_Impstation/Interface/Paper/paper_heading_planarian_stats.png"
    headerMargin: 0.0, 30.0, 0.0, 6.0
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_book.svg.96dpi.png"
    backgroundPatchMargin: 23.0, 16.0, 14.0, 15.0
    contentMargin: 10.0, 10.0, 20.0, 20.0
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: PaperRandomStory
    template: PlanarianStats #i am crazy

- type: entity
  parent: [ OrganBaseLungs, OrganPlanarianInternal, OrganPlanarianMetabolizer ]
  id: OrganPlanarianLungs
  name: lung worm
  description: The lung worm converts oxygen into blood worms, and is the largest organ in the Planarian body.
  suffix: Planarian, Lungs

- type: entity
  parent: [ OrganBaseHeart, OrganPlanarianInternal, OrganAnimalMetabolizer ]
  id: OrganPlanarianHeart
  name: heart worm
  description: The heart worm could be considered the hardest worker in the Planarian body, dutifully delivering individual blood worms to every other organ.
  suffix: Planarian, Heart

- type: entity
  parent: [ OrganBaseStomach, OrganPlanarianInternal, OrganPlanarianMetabolizer ]
  id: OrganPlanarianStomach
  name: stomach bug
  description: The mutualistic relationship between Planarians and stomach bugs is a topic clouded in much mystery. Scientists generally agree that the stomach bug converts food into nutrients for the Planarian, but what it gets in return has yet to be discovered.
  suffix: Planarian, Stomach
  components:
  - type: SolutionContainerManager #imp edit, needs fixing when solutions refactor is merged. something scary is happening here.
    solutions:
      stomach:
          maxVol: 50
      food:
        maxVol: 15

- type: entity
  parent: [ OrganBaseLiver, OrganPlanarianInternal, OrganAnimalMetabolizer ]
  id: OrganPlanarianLiver
  name: meal worm
  description: The meal worm filters toxins and ensures the Planarian body's organs always get a nice hearty meal. Maybe it'll be a nice hearty meal for you, too.
  suffix: Planarian, Liver
  components:
  - type: Edible
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: Nutriment
          Quantity: 13
  - type: FlavorProfile #its some kind of omelette taco thing
    flavors:
      - meaty
      - cheesy
      - tomato
      - egg

- type: entity
  parent: [ OrganBaseKidneys, OrganPlanarianInternal, OrganPlanarianMetabolizer ]
  id: OrganPlanarianKidneys
  name: turned worm
  suffix: Planarian, Kidneys
  description: It finally happened.

