- type: entity
  parent:
  - AppearancePlanarian
  - BaseSpeciesMobOrganic
  id: MobPlanarian
  name: Urist McFlat
  components:
  - type: Damageable
    damageModifierSet: Planarian
  - type: Speech
    speechSounds: Planarian
    speechVerb: Planarian
    allowedEmotes: ['Squeak', 'GoblinMutter']
  - type: TypingIndicator
    proto: planarian
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: PlanarianBlood #in the far future planarians grow blood of their own
        Quantity: 300 #still 300 because its funny to have a lot of blood
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      160: Dead
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/apid_brute_damage.rsi
        color: "#e0f715"
  - type: TransferMindOnGib #transfer mind to other half when cut in two
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 #they split on crit
      behaviors:
      - !type:GibBehavior
  - type: Vocal
    sounds:
      Male: UnisexPlanarian
      Female: UnisexPlanarian
      Unsexed: UnisexPlanarian
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Monkey_burning
  - type: Tag
    tags:
    - VimPilot
    - DoorBumpOpener
    - AnomalyHost
    - CanPilot
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller #they r smaller (2) #they r smaller (3) #they r smaller (4)
        density: 100 #imp edit, dwarves need to be heavy like rock
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: NoSlip #theyre worms

- type: entity
  parent: OrganBase
  id: OrganPlanarian
  abstract: true
  suffix: Planarian

- type: entity
  id: OrganPlanarianMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Planarian ] #they can eat anything

- type: entity
  parent: OrganPlanarian
  id: OrganPlanarianInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  id: OrganPlanarianVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _Impstation/Mobs/Species/Visitors/Planarian/parts.rsi #imp edit, waiting on proper macro merge to migrate files
  - type: VisualOrganMarkings
    markingData:
      group: Planarian

- type: entity
  parent: [ OrganPlanarian, OrganPlanarianVisual ]
  id: OrganPlanarianExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Visitors/Planarian/parts.rsi #imp edit, waiting on proper macro merge to migrate files

- type: entity
  parent: [ OrganPlanarianVisual, OrganBaseEyes, OrganPlanarianInternal ]
  id: OrganPlanarianEyes

- type: entity
  parent: [ OrganBaseTorso, OrganPlanarianExternal ]
  id: OrganPlanarianTorso

- type: entity
  parent: [ OrganBaseHead, OrganPlanarianExternal ]
  id: OrganPlanarianHead
