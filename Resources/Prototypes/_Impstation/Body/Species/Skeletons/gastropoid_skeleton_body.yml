      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: outerClothing
      head:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: head
      shoes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: feet
      eyes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: eyes
      back:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: back
      neck:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Gastropoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: neck
      mask:
