            state: mask
  - type: InitialBody
    organs:
      Torso: OrganGastropoidSkeletonPersonTorso
      Head: OrganGastropoidSkeletonPersonHead
      ArmLeft: OrganGastropoidSkeletonPersonArmLeft
      ArmRight: OrganGastropoidSkeletonPersonArmRight
      HandRight: OrganGastropoidSkeletonPersonHandRight
      HandLeft: OrganGastropoidSkeletonPersonHandLeft
      LegLeft: OrganGastropoidSkeletonPersonLegLeft
      LegRight: OrganGastropoidSkeletonPersonLegRight
      FootLeft: OrganGastropoidSkeletonPersonFootLeft
      FootRight: OrganGastropoidSkeletonPersonFootRight
  - type: HumanoidProfile
    species: SkeletonGastropoid

- type: entity
  parent:
  - AppearanceGastropoidSkeletonPerson
  - MobSkeletonPerson
  id: MobGastropoidSkeletonPerson
  name: Urist McHaunted
  components:
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Impstation/Effects/Footsteps/snailstep.ogg #imp edit, waiting on proper macro merge to migrate files
  - type: MovementSpeedModifier #same as base snail
    baseSprintSpeed: 2.25
    baseWalkSpeed: 1.25
  - type: NoSlip
  - type: Magboots
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/snail_brute_damage.rsi
        color: "#555555AA"

