    species: SkeletonAnomalocarid

- type: entity
  parent:
  - AppearanceAnomalocaridSkeletonPerson
  - MobSkeletonPerson
  id: MobAnomalocaridSkeletonPerson
  name: Urist McVertebrbrbrae
  components:
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/anomalocarid_brute_damage.rsi
        color: "#555555AA"
      Burn:
        sprite: _Impstation/Mobs/Effects/anomalocarid_burn_damage.rsi
  - type: MeleeWeapon
    attackRate: 0.6 #slower swing because they hit harder
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 8
  - type: Speech #need this for the offset
    speechBubbleOffset: 0.35
    speechVerb: Skeleton
#imp edit, this will be used once a later PR is merged that changes how cream pie visuals work
#  - type: CreamPied
#    sprite:
#      sprite: Effects/creampie.rsi
#      state: creampie_anomalocarid
#    offset: 0, 0.375
  - type: LightningTarget # same as normal anomalocarids
    priority: 4
    lightningExplode: false
  - type: Tag
    tags:
    - AnomalocaridClaw #this exists so they can dig through rocks
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - AnomalyHost

