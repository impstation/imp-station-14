      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceReptilianSkeletonPerson
  name: Reptilianskeletonperson appearance
  categories: [ HideSpawnMenu ] #imp
  components:
  - type: InitialBody
    organs:
      Torso: OrganReptilianSkeletonPersonTorso
      Head: OrganReptilianSkeletonPersonHead
      ArmLeft: OrganSkeletonPersonArmLeft
      ArmRight: OrganSkeletonPersonArmRight
      HandRight: OrganSkeletonPersonHandRight
      HandLeft: OrganSkeletonPersonHandLeft
      LegLeft: OrganSkeletonPersonLegLeft
      LegRight: OrganSkeletonPersonLegRight
      FootLeft: OrganReptilianSkeletonPersonFootLeft
      FootRight: OrganReptilianSkeletonPersonFootRight
  - type: HumanoidProfile
    species: SkeletonReptilian

- type: entity
  parent:
  - AppearanceReptilianSkeletonPerson
  - MobSkeletonPerson
  id: MobReptilianSkeletonPerson
  name: Urist McFossil
  components:
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Puller
    needsHands: false
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes

- type: entity
  parent: [ OrganSkeletonPerson, OrganSkeletonPersonExternal ]
  id: OrganReptilianSkeletonPersonExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Impstation/Mobs/Species/Skeletons/ReptilianSkeleton/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Impstation/Mobs/Species/Skeletons/ReptilianSkeleton/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: ReptilianSkeleton

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganReptilianSkeletonPersonExternal ]
  id: OrganReptilianSkeletonPersonTorso

- type: entity
  parent: [ OrganBaseHead, OrganReptilianSkeletonPersonExternal ]
  id: OrganReptilianSkeletonPersonHead
  name: reptilian skull
  components:
  - type: Sprite
    state: skull_icon

- type: entity
  parent: [ OrganBaseFootLeft, OrganReptilianSkeletonPersonExternal ]
  id: OrganReptilianSkeletonPersonFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganReptilianSkeletonPersonExternal ]
  id: OrganReptilianSkeletonPersonFootRight
