- type: entity
  parent:
  - AppearanceUnguSkeletonPerson
  - MobSkeletonPerson
  id: MobUnguSkeletonPerson
  name: Urist McBigboned
  components:
  - type: CowToolProficiency
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.7
  - type: MovementSpeedModifier
    baseSprintSpeed: 2.9
    baseWalkSpeed: 1.3
  - type: CombatModeSprint
    stunSeconds: 1
    doImpactDamage: true
    beginCombatMessage: "ungu-begin-combat-popup"
  - type: CombatModeVisuals
    sprite:
      sprite: _Impstation/Mobs/Species/Ungu/parts.rsi #imp edit, waiting on proper macro merge to migrate files
      state: angry
  - type: CombatMode
  - type: MeleeWeapon
    attackRate: 0.6
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 8
        Structural: 12
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 12
        Structural: 20
  - type: JumpAbility
    action: ActionDash
    jumpDistance: 4
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: .5
        volume: -3
        variation: 0.05

