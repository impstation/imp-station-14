- type: entity
  parent: [DecapoidSpeciesLayers, BaseSpeciesAppearance]
  id: AppearanceDecapoidSkeletonPerson
  name: decapoidskeletonperson appearance
  categories: [ HideSpawnMenu ] #imp
  components:
  - type: InitialBody
    organs:
      Torso: OrganDecapoidSkeletonPersonTorso
      Head: OrganDecapoidSkeletonPersonHead
      ArmLeft: OrganDecapoidSkeletonPersonArmLeft
      ArmRight: OrganDecapoidSkeletonPersonArmRight
      HandRight: OrganDecapoidSkeletonPersonHandRight
      HandLeft: OrganDecapoidSkeletonPersonHandLeft
      LegLeft: OrganDecapoidSkeletonPersonLegFront
      LegRight: OrganDecapoidSkeletonPersonLegBack
      FootLeft: OrganDecapoidSkeletonPersonFootFront
      FootRight: OrganDecapoidSkeletonPersonFootBack
  - type: HumanoidProfile
    species: SkeletonDecapoid

- type: entity
  parent:
  - AppearanceDecapoidSkeletonPerson
  - MobSkeletonPerson
  id: MobDecapoidSkeletonPerson
  name: Urist McShell
  components:
  - type: Inventory
    templateId: decapoid
    speciesId: decapoid
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: jumpsuit
      head:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: gloves
      neck:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi #imp edit, waiting on proper macro merge to migrate files
            state: neck
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/decapoid_brute_damage.rsi #imp edit, waiting on proper macro merge to migrate files
        color: "#555555AA"
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepDecapoid
  - type: Puller #same as base decapoid
    needsHands: false
    applySpeedModifier: false
  - type: Clumsy #ditto
    clumsyVaulting: false
    clumsyHypo: false
    clumsyDefib: false
    clumsyCatching: false
    gunShootFailDamage:
      types:
        Blunt: 5
    clumsySound:
      path: /Audio/_Impstation/Effects/Clumsy/crab_snap.ogg #imp edit, waiting on proper macro merge to migrate files
    gunWhitelist:
      tags:
      - Crusher
    gunFailedMessage: gun-clumsy-decapoid # The gun slips out of your claws!
  - type: CanWieldOneHanded #ditto
  - type: CarrierOneHand #ditto

- type: entity
  parent: OrganSkeletonPerson
