- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceThavenSkeletonPerson
  name: Thavenskeletonperson appearance
  categories: [ HideSpawnMenu ] #imp
  components:
  - type: InitialBody
    organs:
      Torso: OrganThavenSkeletonPersonTorso
      Head: OrganThavenSkeletonPersonHead
      ArmLeft: OrganThavenSkeletonPersonArmLeft
      ArmRight: OrganThavenSkeletonPersonArmRight
      HandRight: OrganThavenSkeletonPersonHandRight
      HandLeft: OrganThavenSkeletonPersonHandLeft
      LegLeft: OrganThavenSkeletonPersonLegLeft
      LegRight: OrganThavenSkeletonPersonLegRight
      FootLeft: OrganThavenSkeletonPersonFootLeft
      FootRight: OrganThavenSkeletonPersonFootRight
  - type: HumanoidProfile
    species: SkeletonThaven

- type: entity
  parent:
  - AppearanceThavenSkeletonPerson
  - MobSkeletonPerson
  id: MobThavenSkeletonPerson
  name: "Urist McThaven't"
  components:
  - type: StrangeMoods
    mood: ThavenMoods #TODO: skeleton moods?
  - type: IonStormTarget
  - type: MeleeWeapon #same as base thaven
    attackRate: 0.55
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 0

