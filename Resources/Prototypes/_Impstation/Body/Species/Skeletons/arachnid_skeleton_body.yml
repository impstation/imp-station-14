  id: OrganArachnidSkeletonPersonHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganArachnidSkeletonPersonExternal ]
  id: OrganArachnidSkeletonPersonHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganArachnidSkeletonPersonExternal ]
  id: OrganArachnidSkeletonPersonLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganArachnidSkeletonPersonExternal ]
  id: OrganArachnidSkeletonPersonLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganArachnidSkeletonPersonExternal ]
  id: OrganArachnidSkeletonPersonFootLeft

