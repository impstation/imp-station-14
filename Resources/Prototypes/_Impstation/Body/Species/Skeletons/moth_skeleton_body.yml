- type: markingsGroup
  id: MothSkeleton
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Eyes:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: true
      default: [ MothSkeletonHood, MothSkeletonAntennae ]
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ MothSkeletonWings ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 3
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMothSkeletonPerson
  name: Mothskeletonperson appearance
  categories: [ HideSpawnMenu ] #imp
  components:
  - type: Inventory
    speciesId: moth
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: jumpsuit-female
      back:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: back
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: jumpsuit-male
      back:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: back
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Moth/displacement.rsi #imp
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganMothSkeletonPersonTorso
      Head: OrganMothSkeletonPersonHead
      ArmLeft: OrganMothSkeletonPersonArmLeft
      ArmRight: OrganMothSkeletonPersonArmRight
      HandRight: OrganMothSkeletonPersonHandRight
      HandLeft: OrganMothSkeletonPersonHandLeft
      LegLeft: OrganMothSkeletonPersonLegLeft
      LegRight: OrganMothSkeletonPersonLegRight
      FootLeft: OrganMothSkeletonPersonFootLeft
      FootRight: OrganMothSkeletonPersonFootRight
  - type: HumanoidProfile
    species: SkeletonMoth

- type: entity
  parent:
  - AppearanceMothSkeletonPerson
  - MobSkeletonPerson
  id: MobMothSkeletonPerson
  name: Urist McGrim
  components:
  - type: MovementSpeedModifier #same as moth
    baseWeightlessAcceleration: 1.5
    baseWeightlessFriction: 1
    baseWeightlessModifier: 1

- type: entity
