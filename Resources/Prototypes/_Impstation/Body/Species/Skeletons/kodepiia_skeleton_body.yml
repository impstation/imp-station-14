- type: entity
  parent:
  - AppearanceKodepiiaSkeletonPerson
  - MobSkeletonPerson
  id: MobKodepiiaSkeletonPerson
  name: Urist McCuttlebone
  components:
  - type: ConsumeAction
    popupSelfStart: kodepiia-consume-start-self
    popupSelfEnd: kodepiia-consume-end-self
    popupOthersStart: kodepiia-consume-start-others
    popupOthersEnd: kodepiia-consume-end-self
    consumeActionId: ActionKodepiiaConsume
    damage:
      types:
        Piercing: 15 #no cellular because they cant actually eat anything
    whitelist:
      components:
      - Respirator
      - Bloodstream
    blacklist:
      components:
      - SiliconLawBound

