- type: entity
  parent:
  - AppearanceAllulaloSkeletonPerson
  - MobSkeletonPerson
  id: MobAllulaloSkeletonPerson
  name: Urist McWishbones
  components:
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/Allulalo_brute_damage.rsi
        color: "#555555AA"
      Burn:
        sprite: _Impstation/Mobs/Effects/Allulalo_burn_damage.rsi
  - type: MeleeWeapon #none of the poison because skeletons dont have liquids in them probaby
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcAllulaloBite
    damage:
      types:
        Piercing: 4
  - type: MovementSpeedModifier # still fast
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: Fixtures #density change missing from macro version, to be upstreamed
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.32
        density: 75 #this is half the normal and makes them very light
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: UnableToWield
  - type: Tag
    tags:
    - VimPilot #fuck it, theyre small enough
    - DoorBumpOpener
    - AnomalyHost
    - CanPilot
    - FootstepSound

