      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceVulpkaninSkeletonPerson
  name: Vulpkaninskeletonperson appearance
  categories: [ HideSpawnMenu ] #imp
  components:
  - type: Inventory
    speciesId: vulpkanin
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: jumpsuit
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: back
      outerClothing:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: outerwear
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: shoes
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: head
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: neck
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: eyes
      belt:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vulpkanin/displacement.rsi
            state: belt
  - type: InitialBody
    organs:
      Torso: OrganVulpkaninSkeletonPersonTorso
      Head: OrganVulpkaninSkeletonPersonHead
      ArmLeft: OrganVulpkaninSkeletonPersonArmLeft
      ArmRight: OrganVulpkaninSkeletonPersonArmRight
      HandRight: OrganVulpkaninSkeletonPersonHandRight
      HandLeft: OrganVulpkaninSkeletonPersonHandLeft
      LegLeft: OrganVulpkaninSkeletonPersonLegLeft
      LegRight: OrganVulpkaninSkeletonPersonLegRight
      FootLeft: OrganVulpkaninSkeletonPersonFootLeft
      FootRight: OrganVulpkaninSkeletonPersonFootRight
  - type: HumanoidProfile
    species: SkeletonVulpkanin

- type: entity
  parent:
  - AppearanceVulpkaninSkeletonPerson
  - MobSkeletonPerson
  id: MobVulpkaninSkeletonPerson
  name: Urist McMilkbone #i guess
  components:
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Piercing: 2
        Slash: 3
  - type: JumpAbility
    action: ActionVulpkaninGravityJump
    canCollide: true
    jumpDistance: 3
    jumpSound:
      path: /Audio/Weapons/punchmiss.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05

