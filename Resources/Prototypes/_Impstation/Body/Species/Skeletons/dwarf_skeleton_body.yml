    species: SkeletonDwarf

- type: entity
  parent:
  - AppearanceDwarfSkeletonPerson
  - MobSkeletonPerson
  id: MobDwarfSkeletonPerson
  name: Urist McSculpture
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150 #even heavier than normal dwarfs
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier # slightly slower than base dwarfs
    baseWalkSpeed: 2.3 # down from 2.5
    baseSprintSpeed: 4.3 # down from 4.5

- type: entity
  parent: [ OrganSkeletonPerson, OrganSkeletonPersonExternal ]
  id: OrganDwarfSkeletonPersonExternal
  abstract: true
  components:
