- type: entity
  parent: [ BaseGameRule, BaseRoundstartAntagRule ]
  id: HereticLowpop
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 5
    delay:
      min: 30
      max: 60
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Heretic
      range:
        min: 1
        max: 3
        playerRatio: 15

- type: entity
  parent: [ BaseGameRule, BaseRoundstartAntagRule ]
  id: HereticSingular # spawns One heretic
  components:
  - type: HereticRule
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags: 
    - !type:FixedAntagCount
      count: 1 # we want just One
      proto: Heretic 
