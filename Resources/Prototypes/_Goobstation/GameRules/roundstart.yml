- type: entity
  parent: [ BaseGameRule, BaseRoundstartAntagRule ] # imp edit, antag selection refactor
  id: Changeling
  components:
  - type: GoobChangelingRule
  - type: GameRule
    minPlayers: 20 #imp: up from 15
    delay:
      min: 30
      max: 60
  - type: AntagObjectives
    objectives:
    - ChangelingStealDNAObjective
    - EscapeIdentityObjective
    - ChangelingSurviveObjective
  - type: AntagSelection
    antags: # imp edit, antag selection refactor
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 15
      range:
        min: 1
        max: 5
    agentName: goob-changeling-roundend-name
