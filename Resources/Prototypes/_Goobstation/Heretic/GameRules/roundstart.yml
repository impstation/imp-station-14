- type: entity
  parent: [ BaseGameRule, BaseRoundstartAntagRule ] # imp edit, antag selection refactor
  id: Heretic
  components:
  - type: HereticRule
  - type: GameRule
    minPlayers: 20
    delay:
      min: 30
      max: 60
  - type: AntagObjectives
    objectives:
    - HereticKnowledgeObjective
    - HereticSacrificeObjective
    - HereticSacrificeHeadObjective
  - type: AntagSelection
    agentName: heretic-roundend-name
    lateJoinAdditional: true
    antags:  # imp edit, antag selection refactor
    - !type:LinearAntagCount
      proto: Heretic
      range:
        min: 1
        max: 6
      playerRatio: 12
