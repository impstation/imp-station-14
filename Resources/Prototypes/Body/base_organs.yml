#imp edit start, manually copied from https://github.com/space-wizards/space-station-14/pull/44197 to fix inedible organs
#this PR partially relies on solutions refactor, so I have copied the relevant parts for now
#this will be replaced fully with the upstream implementation once we reach the commit
- type: entity
  id: OrganBaseOrganic
  name: organ
  abstract: true
  parent: [ OrganBase ]
  components:
  - type: FlavorProfile
    flavors:
    - chicken # INTRODUCING OUR NEW EVERY-MEAT BURRITO, IT'S GOT EVERY MEAT!
  - type: Edible
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 20
  - type: Tag # I am nearing my limit of tolerance for TagComponent.
    tags:
    - Raw
    - Meat
#imp edit end


