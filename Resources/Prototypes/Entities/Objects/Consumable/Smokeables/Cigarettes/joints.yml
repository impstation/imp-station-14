- type: entity
  id: Joint
  parent: BaseCigar
  name: joint
  description: A roll of dried plant matter wrapped in thin paper.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cannabis/joint.rsi
    state: unlit-icon
  - type: Tag
    tags:
      - Cigarette
      - Trash
      - PetWearable # imp
      - KodeEdible # imp
  - type: SpaceGarbage
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cannabis/joint.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
  - type: Construction
    graph: smokeableJoint
    node: joint
# IMP UPMERGE - Solution Torture
# IMP VERSION:
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 30
        reagents:
          - ReagentId: THC
            Quantity: 20
      food:
        maxVol: 30
        reagents:
          - ReagentId: THC
            Quantity: 20
# UPSTREAM VERSION:
  - type: Solution
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 20
# TORTURE END
  - type: RandomMetadata
    nameSegments: [NamesRollie]

- type: entity
  id: JointRainbow
  parent: [Joint, BaseMinorContraband]
  name: joint
  suffix: Rainbow
  description: A roll of dried plant matter wrapped in thin paper. Seems to be colorful inside.
  components:
  - type: Construction
    graph: smokeableJointRainbow
    node: jointRainbow
# IMP UPMERGE - Solution Torture
# IMP VERSION:
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 20
        reagents:
        - ReagentId: SpaceDrugs
          Quantity: 4
        - ReagentId: Lipolicide
          Quantity: 4
        - ReagentId: MindbreakerToxin
          Quantity: 2.66
        - ReagentId: Happiness
          Quantity: 2.66
#       - ReagentId: ColorfulReagent
#         Quantity: 1.33
        - ReagentId: Psicodine
          Quantity: 0.8
      food:
        maxVol: 20
        reagents:
        - ReagentId: SpaceDrugs
          Quantity: 4
        - ReagentId: Lipolicide
          Quantity: 4
        - ReagentId: MindbreakerToxin
          Quantity: 2.66
        - ReagentId: Happiness
          Quantity: 2.66
#       - ReagentId: ColorfulReagent
#         Quantity: 1.33
        - ReagentId: Psicodine
          Quantity: 0.8
# UPSTREAM VERSION:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 10
      - ReagentId: Lipolicide
        Quantity: 5
      - ReagentId: MindbreakerToxin
        Quantity: 5
      - ReagentId: Happiness
        Quantity: 5
  #   - ReagentId: ColorfulReagent
  #     Quantity: 1.33
      - ReagentId: Psicodine
        Quantity: 3.67
# TORTURE END

