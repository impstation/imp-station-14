# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodFrozenBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10

# Ice-cream

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwich
  name: ice-cream sandwich
  description: Portable ice-cream in its own packaging.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - icecream
  - type: Solution # imp
    solutions:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Sugar
        Quantity: 2.5
      - ReagentId: CocoaPowder
        Quantity: 1.25
      - ReagentId: Theobromine
        Quantity: 1.25

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwichStrawberry
  name: strawberry ice-cream sandwich
  description: Portable ice-cream in its own packaging of the strawberry variety.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich-strawberry
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - berry
    - icecream
  - type: Solution # imp
    solutions:
      reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Sugar
          Quantity: 2.5
        - ReagentId: Protein
          Quantity: 1.5

- type: entity
  name: space freezy
  parent: FoodFrozenBase
  id: FoodFrozenFreezy
  description: The best ice-cream in space.
  components:
  - type: Sprite
    state: spacefreezy
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - sweet
    - blueraspberry
    - icecream
  - type: Solution # imp
    solutions:
      reagents:
        - ReagentId: Nutriment
          Quantity: 0.33
        - ReagentId: Milk
          Quantity: 1.67
        - ReagentId: Protein
          Quantity: 4

- type: entity
  name: ice cream sundae # Frontier: no hyphen
  parent: FoodFrozenBase
  id: FoodFrozenSundae
  description: A classic dessert.
  components:
  - type: Sprite
    state: sundae # Frontier: spacefreezy<sundae
  # imp edit start
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - sweet
    - icecream
    - cherry
  - type: Solution
    solutions:
      reagents:
        - ReagentId: Nutriment
          Quantity: 3.83
        - ReagentId: Milk
          Quantity: 1.67
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Vitamin
          Quantity: 3.5
  - type: Tag
    tags:
    - Fruit
  # imp edit end

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenCornuto
  name: choco horn # Frontier: cornuto<choco horn
  description: A Neapolitan vanilla and chocolate ice-cream cone. It menaces with a sprinkling of caramelized nuts.
  components:
  - type: Item
    storedRotation: -45
  - type: Sprite
    state: cornuto
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5.33 # imp 10>5.33
      - ReagentId: Theobromine
        Quantity: 3 # imp 1>3
      - ReagentId: Milk # imp
        Quantity: 1.67
      - ReagentId: Protein # imp
        Quantity: 4
      - ReagentId: CocoaPowder # imp
        Quantity: 4
      - ReagentId: Sugar # imp
        Quantity: 2
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - icecream

# Popsicle

- type: entity
  name: orange creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleOrange
  description: A classic orange creamsicle. A sunny frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: orange
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - sweet
    - icecream
    - orange
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: berry creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleBerry
  description: A vibrant berry creamsicle. A berry good frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: red
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle
  - type: FlavorProfile # Frontier: add flavour profile
    flavors:
    - sweet
    - icecream
    - berry

- type: entity
  name: jumbo ice-cream
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleJumbo
  description: A luxurious ice-cream covered in rich chocolate. It's smaller than you remember.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: jumbo
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5 # imp 10>5
      - ReagentId: Theobromine
        Quantity: 3 # imp 1>3
      - ReagentId: CocoaPowder # imp
        Quantity: 4
      - ReagentId: Sugar # imp
        Quantity: 2

# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: sweet snowcone
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: It's just shaved ice and simple syrup, minimum effort.
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
    - type: Sprite
      layers:
        - state: cone
        - state: alpha-filling
    #      color: foo
    - type: Edible
      trash:
      - FoodFrozenSnowconeTrash
    - type: Solution
      solution:
        reagents:
        - ReagentId: Ice
          Quantity: 8
        - ReagentId: Water
          Quantity: 2
        - ReagentId: Sugar
          Quantity: 2
    - type: Tag # imp
      tags:
      - ReptilianFood
      - UnguFood

- type: entity
  name: flavorless snowcone
  parent: FoodFrozenSnowconeBase
  id: FoodFrozenSnowcone
  description: It's just shaved ice. Still fun to chew on.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ice
        Quantity: 8

- type: entity
