# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml

- type: entity
  parent: [SolutionSmall, FoodMealBase]
  id: FoodTacoShell
  name: taco shell
  description: A taco shell, easy to hold, but falls on its side when put down.
  components:
  - type: Item
    storedOffset: 0,-3
  - type: Edible
    transferAmount: 3
  - type: Sprite
    sprite: Objects/Consumable/Food/taco_sequence.rsi
    layers:
    - state: tacoshell_back
    - map: ["foodSequenceLayers"]
    - state: tacoshell_forward
  - type: Solution
    solution:
      canReact: false # Dont want cause reactions inside tacos after merging ingredients, TODO KILL
      reagents:
      - ReagentId: Nutriment
        Quantity: 1.125 # imp 10>1.125
  - type: FoodSequenceStartPoint
    key: Taco
    maxLayers: 3
    startPosition: -0.15, 0
    offset: 0.15, 0
    minLayerOffset: 0, 0
    maxLayerOffset: 0, 0.05
    nameGeneration: food-sequence-taco-gen
    contentSeparator: ", "
  - type: Appearance

# Old tacos

- type: entity
  abstract: true
  parent: [SolutionSmall, FoodInjectableBase]
  id: FoodTacoBase
  components:
  - type: FlavorProfile
    flavors:
      - meaty
      - cheesy
  - type: Edible
    transferAmount: 3
  - type: Sprite
    sprite: Objects/Consumable/Food/taco.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 21 # imp 29>21
      - ReagentId: Protein
        Quantity: 4 # imp 4>2
      - ReagentId: Vitamin # imp
        Quantity: 1
  - type: Item
    sprite: Objects/Consumable/Food/taco.rsi
    shape:
    - 0,0,1,0
    storedOffset: 0,1
  - type: Tag
    tags:
      - Meat

