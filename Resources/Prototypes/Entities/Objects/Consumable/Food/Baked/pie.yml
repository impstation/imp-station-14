# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodPieBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      reagents: #Most of these are this with slight variations, not worth changing until we have the rest of the reagents
      - ReagentId: Nutriment
        Quantity: 23 # imp 64>23
      #- ReagentId: Vitamin # imp
      #  Quantity: 8
      - ReagentId: Sugar
        Quantity: 5 # imp 8>5
  - type: Edible #It's actually possible now to have a pie stored in a tin rather than spawning trash when you finish eating it. But right now I'm just cleaning up.
    trash:
    - FoodPlateTin
  - type: SliceableFood
    count: 8
  - type: Tag
    tags:
    - Pie

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: FoodPieSliceBase
  abstract: true
  description: A slice of pie. Tasty!
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.8 # imp 8>2.8
      #- ReagentId: Vitamin # imp
      #  Quantity: 1
      - ReagentId: Sugar
        Quantity: 0.625
  - type: Tag
    tags:
    - Pie
    - Slice

# Pie

- type: entity
  name: apple pie
  parent: FoodPieBase
  id: FoodPieApple
  description: A pie containing sweet, sweet love... or apple.
  components:
