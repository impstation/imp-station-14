    - Pie
    - Slice
  - type: Solution # imp
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 4.75
      - ReagentId: Sugar
        Quantity: 0.625
      - ReagentId: Vitamin
        Quantity: 0.625
# Tastes like pie, apple.

- type: entity
