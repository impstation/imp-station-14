    flavors:
    - sweet
    - apple
  - type: Sprite
    layers:
    - state: tin
    - state: apple
  - type: SliceableFood
    slice: FoodPieAppleSlice
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: Solution #imp
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 38
      - ReagentId: Sugar
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 5

- type: entity
  name: slice of apple pie
  parent: FoodPieSliceBase
  id: FoodPieAppleSlice
