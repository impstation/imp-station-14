        - ReagentId: Sugar
          Quantity: 0.625
        - ReagentId: TableSalt # sorry snails
          Quantity: 0.625
  - type: Tag
    tags:
    - UnguFood
    - Pie
    - Slice
    - ReptilianFood # pistachios
  # imp edit end
# Tastes like pie, nuts.

- type: entity
  name: banana cream pie
  parent: FoodPieBase
  id: FoodPieBananaCream
  description: Just like back home, on clown planet! HONK!
  components:
  - type: FlavorProfile
    flavors:
    - sweet
    - banana
    - creamy
  - type: Sprite
    layers:
    - state: tin
    - state: plain
  - type: CreamPie
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: ContainerContainer
    containers:
      payloadSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      payloadSlot:
        whitelist:
          components:
          - TimerTrigger
        insertSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        swap: false
        disableEject: true
  - type: Tag
    tags:
    - Fruit
    - Pie
  - type: SliceableFood
    slice: FoodPieBananaCreamSlice
  - type: Solution # imp
    solutions:
      reagents:
      - ReagentId: Nutriment
        Quantity: 47
      - ReagentId: Sugar
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 6

- type: entity
  name: slice of banana cream pie
  parent: FoodPieSliceBase
  id: FoodPieBananaCreamSlice
  description: Just like back home, on clown planet! HONK!
