# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodBreadBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
# IMP UPMERGE - Solution Torture
# IMP VERSION:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25 # imp
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
# UPSTREAM VERSION:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80
# TORTURE END

- type: entity
  parent: [SolutionVeryTiny, FoodBreadBase]
  id: FoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread
    - Slice
# IMP UPMERGE - Solution Torture
# IMP VERSION:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5 # imp
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
# UPSTREAM VERSION:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10 # 1/8 of a loaf of bread
# TORTURE END

# Custom Bread Example

- type: entity
  name: volcanic loaf
  parent: FoodBreadBase
  id: FoodBreadVolcanic
  description: A dark loaf. Resembles pumice.
  components:
  - type: Sprite
    layers:
    - state: alpha
      color: "#281415"
    - state: alpha-filling
      color: "#FF613F"
  - type: SliceableFood
    count: 8
    slice: FoodBreadVolcanicSlice

- type: entity
  name: volcanic slice
  parent: FoodBreadSliceBase
  id: FoodBreadVolcanicSlice
  description: A slice of dark loaf. Resembles pumice.
  components:
  - type: Sprite
    layers:
    - state: alpha-slice
      color: "#281415"
    - state: alpha-slice-filling
      color: "#FF613F"

