  - type: FlavorProfile
    flavors:
    - meaty
    - bread
  - type: SliceableFood
    count: 8
    slice: FoodBreadSausageSlice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 34 # imp 105>34
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: Protein
        Quantity: 25 # imp 10>25
      - ReagentId: UncookedAnimalProteins
        Quantity: 20 # imp 25>20
