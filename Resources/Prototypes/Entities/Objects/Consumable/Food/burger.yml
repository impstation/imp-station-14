# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBun
  name: bun
  description: A hamburger bun. Round and convenient to hold.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: FoodBreadBunTop
        amount: 1
      - id: FoodBreadBunBottom
        amount: 1

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: bottom bun
  description: It's time to start building the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    maxLayers: 100 # imp
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  # IMP UPMERGE - Solution Torture
  # IMP SOLUTION:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15 # imp
        canReact: true # fuck you wizden i need razorium burger assassination
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.3 # 1/2 of a bun
  # UPSTREAM SOLUTION:
  - type: Solution
    solution:
      maxVol: 7.5
      canReact: false # Dont want cause reactions inside burgers after merging ingredients, TODO Remove
      reagents:
      - ReagentId: Nutriment
        Quantity: 5 # 1/2 of a bun
  # TORTURE END

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: top bun
  description: The perfect finish for your burger tower.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: Solution
    solution:
      maxVol: 7.5
      canReact: false # Dont want cause reactions inside burgers after merging ingredients, TODO Remove
      reagents:
      - ReagentId: Nutriment
        Quantity: 5 # 1/2 of a bun
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 10
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

