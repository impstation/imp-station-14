# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionSmall, FoodInjectableBase]
  id: FoodNoodlesBase
  description: Now that's a nice pasta!
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: boiled spaghetti
  description: A plain dish of noodles, this needs more ingredients.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
    - pasta
    ignoreReagents: # imp
    - egg
  - type: Sprite
    state: boiled
  # imp edit start
  - type: Solution
    solutions:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10.5
      - ReagentId: Protein
        Quantity: 12
  - type: Tag
    tags:
    - UnguFood
  # imp edit end
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: spaghetti
  description: Spaghetti and crushed tomatoes. Just like your papa used to make! # imp change
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
    - pasta
    - tomato
  - type: Sprite
    state: tomato
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 24.5 # imp 45>24.5
      - ReagentId: Vitamin
        Quantity: 6 # imp 5>6
      - ReagentId: Protein # imp
        Quantity: 12
  - type: Tag
    tags:
    - Fruit # ???
# Tastes like pasta, tomato.

- type: entity
  parent: [SolutionNormal, FoodNoodlesBase]
  id: FoodNoodlesCopy
  name: copypasta
  description: You probably shouldn't try this, you always hear people talking about how bad it is...
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Edible
    trash:
    - FoodPlateSmall
    - FoodPlateSmall
  - type: FlavorProfile
    flavors:
    - copypasta
  - type: Sprite
    state: copypasta
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 49 # imp 90>49
      - ReagentId: Vitamin
        Quantity: 12 # imp 10>12
      - ReagentId: Protein # imp
        Quantity: 24
  - type: Tag # imp, normal spaghetti is fruit so
    tags:
    - Fruit
# Tastes like pasta, bad humor.

