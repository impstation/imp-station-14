- type: entity
  parent: [SheetOtherBase, FoodBase]
  id: SheetUranium
  name: uranium
  description: A sheet of Element 92. Puts the 'new' in 'nuclear'. # imp
  suffix: Full
  components:
  - type: Edible
    transferAmount: 10
    solution: composite
  - type: BadFood
  - type: PhysicalComposition
    materialComposition:
      Uranium: 100
  - type: Stack
    stackType: Uranium
    baseLayer: base
    layerStates:
    - uranium
    - uranium_2
    - uranium_3
  - type: Sprite
    state: uranium_3
    layers:
    - state: uranium_3
      map: ["base"]
  - type: Item
    heldPrefix: uranium
  - type: Solution
    solution:
      reagents:
      - ReagentId: Uranium
        Quantity: 8
      - ReagentId: Radium
        Quantity: 2
      canReact: false
  # imp edit start
  - type: RadiationSource
    intensity: 0.01
    slope: 3
  - type: PointLight
    radius: 1.2
    energy: 0.8
    castShadows: false
    color: "#9be792"
  # imp edit end

- type: entity
  parent: SheetUranium
  id: SheetUranium1
  name: uranium
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: SheetOtherBase
  id: MaterialSheetMeat
  name: meat sheet
  description: A sheet of meat; a meat sheet. # imp
  suffix: Full
  components:
    - type: Sprite
      sprite: Objects/Materials/Sheets/meaterial.rsi
      layers:
      - state: meat_3
        map: [ "base" ]
    - type: Tag
      tags:
      - Sheet
      - DroneUsable #imp
      - KodeEdible # imp
      - ReptilianFood # imp
      - SpiderFood # imp
    - type: Material
    - type: PhysicalComposition
      materialComposition:
        Meaterial: 100
    - type: Stack
      stackType: MeatSheets
      baseLayer: base
      layerStates:
        - meat
        - meat_2
        - meat_3
    - type: Item
      sprite: Objects/Materials/Sheets/meaterial.rsi
      heldPrefix: meat
    - type: SolutionContainerManager
    - type: Edible # imp
      requiresSpecialDigestion: true
    - type: Solution
      solution:
        reagents:
        - ReagentId: UncookedAnimalProteins # imp changed from Protein so it doesn't poison the only species who could eat it??????
          Quantity: 7
        - ReagentId: Fat
          Quantity: 3
        canReact: false

- type: entity
  parent: MaterialSheetMeat
  id: MaterialSheetMeat1
  suffix: Single
  components:
    - type: Sprite
      state: meat
    - type: Stack
      count: 1
