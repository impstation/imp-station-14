- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetOtherBase
  description: A sheet of material, used often on the station in various applications.
  components:
  - type: Sprite
    sprite: Objects/Materials/Sheets/other.rsi
  - type: Item
    sprite: Objects/Materials/Sheets/other.rsi
  - type: Solution
    solution:
      canReact: false
  - type: NonMobStatusIcon #imp edit. for the salvohud
  - type: PluralName # imp
    oneOf: plural-name-sheet-1
    someOf: plural-name-sheet-2plus

- type: entity
  parent: SheetOtherBase
  id: SheetPaper
  name: paper
  description: Most commercially-made paper is made from paper. Paper is made from wood, trees, and paper. # imp
  suffix: Full
  components:
  - type: Stack
    stackType: Paper
    baseLayer: base
    layerStates:
    - paper
    - paper_2
    - paper_3
  - type: PhysicalComposition
    materialComposition:
      Paper: 100
  - type: Sprite
    state: paper_3
    layers:
    - state: paper_3
      map: ["base"]
  - type: Item
    heldPrefix: paper
  - type: Solution
    solution:
      reagents:
      - ReagentId: Cellulose
        Quantity: 5

- type: entity
  parent: SheetPaper
  id: SheetPaper1
  name: paper
  suffix: Single
  components:
  - type: Sprite
    state: paper
  - type: Stack
    count: 1

