- type: entity
  abstract: true
  parent: [SolutionTank, SolutionGinormous, BaseWallmountMetallic]
  id: BaseDispenser
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/walldispenser.rsi
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTypeTrigger
        damageType: Piercing
        damage: 5
      behaviors:
      - !type:SolutionExplosionBehavior
        solution: tank
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: ExaminableSolution
    solution: tank
  # imp edit start, allows refilling with verb or click-and-dragging
  - type: DumpableSolution
    solution: tank
  # imp edit end

- type: entity
  parent: BaseDispenser
  id: CleanerDispenser
  name: space cleaner dispenser
  description: Wallmount Space Cleaner dispenser.
  components:
  - type: Sprite
    layers:
    - state: cleanerdispenser
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
# IMP UPMERGE - Solution Torture
# IMP VERSION:
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 5000
        reagents:
        - ReagentId: SpaceCleaner
          Quantity: 2500 #imp edit, was 5000
# UPSTREAM VERSION:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceCleaner
        Quantity: 960
# TORTURE END

- type: entity
  parent: BaseDispenser
  id: FuelDispenser
  name: fuel dispenser
  description: Wallmount Fuel dispenser.
  components:
  - type: Sprite
    layers:
    - state: fueldispenser
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
  - type: Solution
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 960
  - type: ReagentTank
    tankType: Fuel
    fuelBlacklist: #imp
      tags:
        - EchionGun
  - type: DamageOnToolInteract
    tools: Welding
    weldingDamage:
      types:
        Heat: 20
  - type: PacifismDangerousAttack
  - type: Explosive
    explosionType: Default
    totalIntensity: 50
