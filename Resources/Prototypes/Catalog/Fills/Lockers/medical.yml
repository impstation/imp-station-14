# Medical supply lockers

- type: entityTable
  id: LockerFillMedicine
  table: !type:AllSelector
    children:
 #imp edit start
    #- !type:NestedSelector
    #  tableId: CoreMedicineReagentBottleTable
    #  rolls: 2
    #- !type:GroupSelector # Basic topicals
    #  rolls: 7
    #  children:
    #  - id: Brutepack
    #  - id: Ointment
    #  - id: Bloodpack
    #  - id: Gauze
    #    weight: 0.5
    - id: BoxSyringe
    - id: ChemistryBottleEpinephrine
    - id: Brutepack
      amount: !type:ConstantNumberSelector
        value: 2
    - id: Ointment
      amount: !type:ConstantNumberSelector
        value: 2
    - id: Bloodpack
      amount: !type:ConstantNumberSelector
        value: 2
    - id: Gauze
  #imp edit end

- type: entity
  parent: LockerMedicine
  id: LockerMedicineFilled
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: LockerFillMedicine

- type: entity
