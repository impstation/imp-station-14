- type: entity
  name: raw kodepiia meat
  parent: FoodMeatRawBase
  id: FoodMeatKodepiia
  description: Is it still moving...?
  components:
  - type: Sprite
    sprite: _MACRO/Objects/Consumable/Food/Meat/kodepiia_meat.rsi
    state: kodepiia
  - type: Construction
    graph: KodepiiaFlakes
    node: start
    defaultTarget: crispy kodepiia flakes
  - type: FlavorProfile
    flavors:
    - meaty
    - kodepiia

- type: entity
  name: crispy kodepiia flakes
  parent: FoodMeatBase
  id: FoodMeatKodepiiaCooked
  description: Crackly, salty, and just a little alive.
  components:
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Sprite
    sprite: _MACRO/Objects/Consumable/Food/Meat/kodepiia_meat.rsi
    layers:
    - state: kodepiia-cooked
      map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: Construction
    graph: KodepiiaFlakes
    node: crispy kodepiia flakes
  - type: FlavorProfile
    flavors:
    - meaty
    - kodepiia

- type: entity
  name: raw thaven fillet
  parent: FoodMeatFish
  id: FoodThavenMeat
  description: Concerning.
  components:
  - type: FlavorProfile
    flavors:
    - thavenflesh
  - type: FoodSequenceElement
    entries:
      Burger: ThavenBurger
