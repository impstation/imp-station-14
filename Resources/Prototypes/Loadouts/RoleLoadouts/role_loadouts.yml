# IMP START REORDERING CONVENTION: DO IT IN THIS ORDER
# Head
# Mask
# Neck
# Jumpsuit
# OuterClothing
# Gloves
# Belt
# Shoes
# Headset
# Glasses
# Backpack
# PDA
# Survival
# Trinkets
# Special
# GroupSpeciesBreathTool
# GroupTankHarness
# Weapon
# Ammo
# END IMP
# Command
- type: roleLoadout
  id: JobCaptain
  groups:
  - CaptainHead
  - CaptainNeck
  - CaptainJumpsuit
  - CaptainOuterClothing
  - CaptainGloves #imp
  - CaptainShoes #imp
  - CommandHeadset #imp
  - CaptainGlasses #imp
  - CaptainBackpack # Imp reorder
  - SurvivalCommand # imp Survival > SurvivalCommand
  - Trinkets
  - CaptainJobTrinkets
  - GroupSpeciesBreathToolCommand # imp GroupSpeciesBreathTool > GroupSpeciesBreathToolCommand
  - GroupTankHarnessCommandWithOuterwear # imp, Assign GroupTankHarness to jobs without outer clothing and GroupTankHarnessWithOuterwear to jobs with
  - GroupBreathToolDecapoid # MACRO: Decapoid

- type: roleLoadout
  id: JobHeadOfPersonnel
  groups:
  - HoPHead
  - HoPNeck
  - HoPJumpsuit
  - HoPOuterClothing
