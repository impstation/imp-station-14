  components:
  - type: FlavorProfile
    flavors:
    - vanilla
    - sweet
    - sublime
  - type: SliceableFood
    count: 8
    slice: FoodMothMothmallowSlice
  - type: Sprite
    sprite: _Nyanotrasen/Objects/Consumable/Food/moth.rsi
    state: mothmallow
  - type: Solution
    solution:
      reagents:
      - ReagentId: Protein
        Quantity: 12
      - ReagentId: Nutriment
        Quantity: 8
      - ReagentId: Sugar
        Quantity: 10
      - ReagentId: Rum
        Quantity: 5
      - ReagentId: MilkSoy
        Quantity: 5
  - type: Tag # imp
    tags:
    - UnguFood
    - ReptilianFood
    - ClothMade
