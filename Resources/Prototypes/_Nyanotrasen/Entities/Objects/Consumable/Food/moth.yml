# imp notice: all reagent inventories rebalanced to meet our food standards

#Soups and Stews

- type: entity
  name: cotton soup
  parent: FoodBowlBase
  id: FoodMothCottonSoup
  description: A soup made from raw cotton in a flavourful vegetable broth. Enjoyed only by moths and the criminally tasteless.
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - potatoes # imp
    - carrot # imp
  - type: Sprite
    sprite: _Nyanotrasen/Objects/Consumable/Food/moth.rsi
    state: cottonsoup
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vitamin
        Quantity: 7
      - ReagentId: JuiceCarrot
        Quantity: 5
      - ReagentId: Oculine
        Quantity: 3
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: Cellulose
        Quantity: 10
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - Soup
#Tastes like cotton and broth

# Salad

- type: entity
  name: cotton salad
  parent: FoodBowlBase
  id: FoodMothCottonSalad
  description: A salad with added cotton and a basic dressing. Presumably moths are around.
  components:
  - type: FlavorProfile
    flavors:
    - cheesy
    - leafy
    - bread
  - type: Sprite
    sprite: _Nyanotrasen/Objects/Consumable/Food/moth.rsi
    state: cottonsalad
  - type: Solution
    solution:
      reagents: # wth is this recipe
      - ReagentId: Nutriment
        Quantity: 27.5
      - ReagentId: Fiber
        Quantity: 40
      - ReagentId: Bicaridine
        Quantity: 15
      - ReagentId: Kelotane
        Quantity: 15
      - ReagentId: Vitamin
        Quantity: 6
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - Soup
#Tastes like cheese, salad and bread

# Pizzas

- type: entity
