- type: entity
  name: moffin
  parent: FoodBakedBase
  id: FoodMothMoffin
  description: A delicious, spongy and dusty little cake.
  components:
  - type: Sprite
    sprite: _Nyanotrasen/Objects/Consumable/Food/moth.rsi
    layers:
    - state: moffin
      map: [ "enum.DamageStateVisualLayers.Base" ]
    netsync: false
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        moffin: ""
    - enum.DamageStateVisualLayers.Base:
        moffin2: ""
    - enum.DamageStateVisualLayers.Base:
        moffin3: ""
  - type: FlavorProfile
    flavors:
    - muffin
    - cotton
    - fiber
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 1.125
      - ReagentId: Sugar
        Quantity: 10
      - ReagentId: Fiber
        Quantity: 10
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
    - ClothFood # imp

