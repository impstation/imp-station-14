- type: entityTable
  id: BasicCalmEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLockerDefault # imp
    - id: BluespaceLockerRandom # imp
    - id: BluespaceLockerRandomUnrestricted # imp
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    #- id: CockroachMigration
    - id: GasLeak
    # - id: GreytideVirus
    - id: IonStorm # its calm like 90% of the time smh
    - id: KudzuGrowth
    - id: MassHallucinations
    #- id: MimicVendorRule
    #- id: MouseMigration
    - id: PowerGridCheck
    - id: RandomSentience
    #- id: SlimesSpawnHorde
    - id: SolarFlare
    #- id: SnakeSpawnHorde
    #- id: SpiderClownSpawnHorde
    #- id: SpiderSpawnHorde
    - id: VentClog
    - id: ButlerSpawn # imp
    - id: GoblinKnightEvent # imp
    - id: HereticBooksSpawnSmall #imp
    - id: BiomagneticPolarization # imp
    - id: ExplosiveMineResurfacing # imp
    - id: SynthStorm # CD: Unique event for synths

- type: entityTable
  id: GreaterAntagEventsTable #imp: higher impact antags
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: DragonSpawn
    - id: KingRatMigration
    - id: NinjaSpawn
    - id: RevenantSpawn
    - id: SleeperAgents
    - id: ZombieOutbreak
    - id: LoneOpsSpawn
    - id: WizardSpawn
    - id: ChangelingAwakening #imp
    - id: BountyHunterSpawn # imp
    - id: ReplicatorSpawn # imp
    - id: VRexEvent #imp
    - id: EeepEvent # imp

- type: entityTable
  id: LesserAntagEventsTable # imp: lower impact antags
  table: !type:AllSelector
    children:
    - !type:NestedSelector # DV
      tableId: BasicAntagEventsTableDV
    - id: ClosetSkeleton
    - id: ParadoxCloneSpawn
    - !type:NestedSelector
      tableId: DerelictBorgEventTable
    - id: GoblinStowawaysEvent #imp
    - id: GoblinCastawaysEvent #imp
    - id: OppaSpawnLight #imp
    - id: OppaSpawnNight #imp
    - id: SyndicateInfiltratorSpawn # imp
    - id: SyndicateInstigatorSpawn # imp
    - !type:NestedSelector # imp
      tableId: TouristShuttleEvents

- type: entityTable
  id: SleeperlessGreaterAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector # DV
      tableId: BasicAntagEventsTableDV
    - id: DragonSpawn
    - id: KingRatMigration
    - id: NinjaSpawn
    - id: RevenantSpawn
    - id: ZombieOutbreak
    - id: LoneOpsSpawn
    - id: WizardSpawn
    - id: ChangelingAwakening # imp
    - id: BountyHunterSpawn # imp
    - id: ReplicatorSpawn # imp
    - id: VRexEvent # imp
    - id: EeepEvent # imp

- type: entityTable
  id: DerelictBorgEventTable #For Derelict Borg spawns
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Standard NT Borgs
      weight: 85
      children:
      - id: DerelictEngineerCyborgSpawn
      - id: DerelictGenericCyborgSpawn
      - id: DerelictJanitorCyborgSpawn
      - id: DerelictMedicalCyborgSpawn
      - id: DerelictMiningCyborgSpawn
    - !type:GroupSelector # Other Borgs
      weight: 15
      children:
      - id: DerelictSyndicateAssaultCyborgSpawn

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseAntagGhostRoleRule
  components:
  - type: AntagSelection
    selectionTime: Never

- type: entity
  id: BaseStationEvent
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventShortDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventLongDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  40
      max:  60

- type: entity
  id: AnomalySpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    #startAnnouncementColor: "#18abf5" #imp edit
    #startAudio:
    #  path: /Audio/Announcements/announce.ogg
    weight: 8
    duration: 35
  - type: AnomalySpawnRule

- type: entity
  id: BluespaceArtifact
  parent: BaseStationEventShortDelay
  components:
  - type: GameRule
    delay:
      min:  30
      max:  30
  - type: StationEvent
    #startAnnouncementColor: "#18abf5" #imp edit
    #startAudio:
    #  path: /Audio/Announcements/announce.ogg
    weight: 8
    duration: 35
  - type: BluespaceArtifactRule

- type: entity
  id: BluespaceLocker # imp: currently will not run, replaced by other locker rules
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 2
    reoccurrenceDelay: 5
    earliestStart: 1
    duration: 1
  - type: BluespaceLockerRule

- type: entity
  id: BreakerFlip
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 7
    duration: 1
    minimumPlayers: 15
  - type: BreakerFlipRule

- type: entity
  id: BureaucraticError
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: true #imp
    minimumPlayers: 25
    weight: 3
    duration: 1
  - type: BureaucraticErrorRule
    ignoredJobs:
    - StationAi
    - ResearchAssistant
    - MedicalIntern
    - SecurityCadet
    - TechnicalAssistant

- type: entity
  id: ClericalError
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: true #imp
    minimumPlayers: 15
    weight: 5
    duration: 1
  - type: ClericalErrorRule

- type: entity
  parent: BaseGameRule
  id: ClosetSkeleton
  components:
  - type: StationEvent
    weight: 5
    duration: 1
    minimumPlayers: 15 #imp
  - type: RandomEntityStorageSpawnRule
    prototype: MobSkeletonCloset

- type: entity
  parent: BaseAntagGhostRoleRule
  id: DragonSpawn
  components:
  - type: StationEvent
    weight: 6.5
    earliestStart: 30 #imp, originally 40
    reoccurrenceDelay: 20
    minimumPlayers: 30 #imp
    duration: null
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: MobDragon
  - type: DragonRule
  - type: AntagObjectives
    objectives:
    - CarpRiftsObjective
    - DragonSurviveObjective
  - type: AntagSelection
    agentName: dragon-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: Dragon
  - type: DynamicRuleCost
    cost: 75

- type: entity
  parent: BaseAntagGhostRoleRule
  id: NinjaSpawn
  components:
  - type: StationEvent
    weight: 3 #imp
    duration: null
    earliestStart: 30
    reoccurrenceDelay: 20
    minimumPlayers: 30
  - type: SpaceSpawnRule
  - type: AntagLoadProfileRule
  - type: AntagObjectives
    objectives:
    - StealResearchObjective
    - DoorjackObjective
    - SpiderChargeObjective
    - TerrorObjective
    - MassArrestObjective
    - NinjaSurviveObjective
  - type: AntagSelection
    agentName: ninja-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: SpaceNinja
  - type: DynamicRuleCost
    cost: 75

- type: entity
  parent: BaseAntagGhostRoleRule
  id: ParadoxCloneSpawn
  components:
  - type: StationEvent
    weight: 5
    duration: null
    earliestStart: 20
    reoccurrenceDelay: 20
    minimumPlayers: 15
  - type: ParadoxCloneRule
    objectiveBlacklist:
      tags:
      - ParadoxCloneObjectiveBlacklist
  #- type: AntagObjectives
   # objectives:
    # - ParadoxCloneKillObjective # imp to allow for savior clones
    # - ParadoxCloneLivingObjective
  # - type: AntagRandomSpawn imp edit, uses midround antag spawners
  - type: AntagRandomObjectives # imp
    sets:
    - groups: ParadoxTypeGroups
    maxDifficulty: 2 # will pick two objective
  - type: AntagSelection
    agentName: paradox-clone-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: ParadoxClone
  - type: DynamicRuleCost
    cost: 50

- type: entity
  parent: BaseGameRule
  id: RevenantSpawn
  components:
  - type: StationEvent
    weight: 7.5
    duration: 1
    earliestStart: 30 #imp, original 45
    minimumPlayers: 20
  - type: RandomSpawnRule
    prototype: MobRevenant

- type: entity
  parent: [ BaseAntagGhostRoleRule, BaseWizardRule ]
  id: WizardSpawn
  components:
  - type: StationEvent
    weight: 1 # rare
    duration: null
    earliestStart: 30
    reoccurrenceDelay: 60
    minimumPlayers: 15 # imp, was 30

