- type: antag
  id: SpaceNinja
  name: roles-antag-space-ninja-name
  antagonist: true
  playTimeTracker: AntagNinja # imp
  requirements:
  - !type:OverallPlaytimeRequirement # Imp
    time: 1h
  setPreference: false
  objective: roles-antag-space-ninja-objective
  guides: [ SpaceNinja ]

- type: antagSpecifier
  parent: RestrictedAntag
  id: SpaceNinja
  spawnerPrototype: SpawnPointGhostSpaceNinja
  pickPlayer: false
  startingGear: SpaceNinjaGear
  roleLoadout:
  - RoleSurvivalSpaceNinja
  briefing:
    text: ninja-role-greeting
    color: Green
    sound: /Audio/Misc/ninja_greeting.ogg
  components:
  - type: SpaceNinja
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
  - type: RandomMetadata
    nameSegments:
    - NamesNinjaTitle
    - NamesNinja
    nameFormat: name-format-ninja
  mindRoles:
  - MindRoleNinja

#Ninja Gear
- type: startingGear
  id: SpaceNinjaGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitNinja
    back: ClothingBackpackSatchelNinja
    mask: ClothingMaskNinja
    head: ClothingHeadHelmetSpaceNinja
    eyes: ClothingEyesVisorNinja
    gloves: ClothingHandsGlovesSpaceNinjaWeak # imp
    outerClothing: ClothingOuterSuitSpaceNinja
    shoes: ClothingShoesSpaceNinja
    id: NinjaPDA
    ears: ClothingHeadsetNinja
    pocket1: SpiderCharge
    pocket2: PinpointerStation
    belt: EnergyKatanaStun # imp
  inhand:
    - JetpackBlackFilled
  # begin imp edit, replaced toolset with omnitool and added smoke grenades
  storage:
    back: # belt holds katana so satchel has the tools for sabotaging things
    #- Crowbar
    #- Wrench
    #- Screwdriver
    #- Wirecutter
    #- Welder
    #- Multitool
    - Omnitool
    - SmokeGrenade
    - SmokeGrenade
    - SmokeGrenade
    - SmokeGrenade
  # end imp edit
    - EmergencyMedipen
    - Flare
    - FoodSnackNutribrick
    - DrinkWaterBottleFull

- type: chameleonOutfit
  id: NinjaChameleonOutfit
  name: roles-antag-space-ninja-name
  icon: "JobIconNinja"
  startingGear: SpaceNinjaGear
  equipment:
    neck: ClothingNeckGoldmedal
