- type: entity
  parent: [FragileGrenadeBase, ProjectileGrenadeBase]
  id: GrenadeFoamFarceDart
  name: foam dart grenade
  description: Releases a bothersome spray of foam darts that cause severe welching.
  suffix: Foam Farce
  components:
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_grenade.rsi
    layers:
    - state: icon
      map: ["Base"]
    - state: primed
      map: [ "enum.TriggerVisualLayers.Base" ]
  - type: ProjectileGrenade
    fillPrototype: PelletClusterLethal
    capacity: 30
  - type: TriggerOnUse
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
    delay: 3
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound:
      path: "/Audio/Weapons/Guns/Gunshots/batrifle.ogg"
    positional: true
