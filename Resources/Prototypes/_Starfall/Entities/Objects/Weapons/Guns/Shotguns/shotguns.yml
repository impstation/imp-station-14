- type: entity
  name: Foam Force Astro Ace
  parent: [ BaseToyGun, BaseWeaponShotgun, BaseGunWieldable ]
  id: WeaponShotgunFoamFarceDarts
  description: A premium foam rifle of the highest quality. Its plastic feels rugged, and its mechanisms sturdy.
  suffix: Foam Farce, Darts loaded
  components:
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_rifle.rsi
  - type: Clothing
    sprite: Objects/Fun/Foam/foam_rifle.rsi
  - type: Item
    sprite: Objects/Fun/Foam/foam_rifle_inhand_64x.rsi
    size: Normal
    shape:
    - 0,0,3,0
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - ShellShotgun
      - BulletFoam
    capacity: 10
    proto: BulletFoam
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Effects/thunk.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: StaticPrice
    price: 100

