- type: entity
  parent:
  - AppearanceGoblin
  - BaseSpeciesMobOrganic
  id: MobGoblin
  name: Urist McGoblin
  components:
  - type: VentCrawler
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 135
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Goblin
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 3
  #        Poison: 1 # Too Stinky
  - type: Speech
    speechSounds: Alto
    speechVerb: Goblin
    allowedEmotes: ['GoblinMutter','GoblinThroatSinging','Hiss'] # imp
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
  - type: Item
    size: Normal
  - type: Vocal
    wilhelm: "/Audio/_NF/Voice/Goblin/goblin_cackle_5.ogg"
    sounds:
      Male: MaleGoblin
      Female: FemaleGoblin
      Unsexed: MaleGoblin
  - type: Goblin
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/goblin_brute_damage.rsi #imp. these sprites are just chest & are sooo lazy but who care
        color: "#5c7500"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: GoblinBlood
        Quantity: 250
  - type: Butcherable
    spawned:
    - id: FoodMeatGoblin
      amount: 3
  - type: GoblinAccent
  - type: TypingIndicator
    proto: goblin
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.85  # 0.7 is base speed.
      80: 0.75  # 0.5 is base speed.
  - type: Tag #needed to redefine from parent to add VimPilot
    tags:
    - VimPilot
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - AnomalyHost
  - type: Reactive
    reactions:
    - reagents: [ Water, SpaceCleaner, SoapReagent ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water, SpaceCleaner, SoapReagent ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: Rummager
    rummageLoot: !type:NestedSelector
      tableId: BaseGoblinLoot
  - type: GoobAbsorbable
    biomassRestored: 0.5


