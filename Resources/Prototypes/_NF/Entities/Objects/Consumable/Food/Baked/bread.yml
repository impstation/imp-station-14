# imp notice all food contents have been altered

- type: entity
  name: honey challah
  parent: FoodBreadBase
  id: FoodBreadChallah
  description: Twisted bread sprinkled with poppy seeds.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - honey
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/Baked/bread.rsi
    state: challah
  - type: SliceableFood
    count: 8
    slice: FoodBreadChallahSlice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 4.375
      - ReagentId: Bicaridine
        Quantity: 4
  - type: Tag # imp
    tags:
    - UnguFood
    - Bread

- type: entity
  name: challah slice
  parent: FoodBreadSliceBase
  id: FoodBreadChallahSlice
  description: A slice of poppy and honey, oh my!
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - honey
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 0.547
      - ReagentId: Bicaridine
        Quantity: 0.5
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/Baked/bread.rsi
    state: challahslice
  - type: Tag # imp
    tags:
    - UnguFood
    - Bread
    - Slice
