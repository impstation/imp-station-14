    sprite: _NF/Objects/Consumable/Food/sushi.rsi
  - type: Tag
    tags:
    - Sushi

- type: entity
  name: avocado sushi
  parent: [FoodBaseSushi, FoodMealBase]
  id: FoodMealAvocadoSushi
  description: Where did the seaweed come from?
  components:
  - type: FlavorProfile
    flavors:
    - cucumber
    - avocado
  - type: Sprite
    state: avocadosushi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 13
      - ReagentId: Vitamin
        Quantity: 15
      - ReagentId: JuiceCarrot
        Quantity: 5
      - ReagentId: Oculine
        Quantity: 3
      - ReagentId: Rice
        Quantity: 15
  - type: SliceableFood
    count: 6
    slice: FoodMealAvocadoSushiSlice
  - type: Tag # imp
    tags:
    - Sushi
    - Fruit
    - Vegetable

