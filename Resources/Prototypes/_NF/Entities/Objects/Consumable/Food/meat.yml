# Raw
- type: entity
  parent: FoodMeatRotten
  id: FoodMeatGoblin
  name: raw goblin meat
  description: Just look at that marbling! Wait, is that microplastic?
  components:
  - type: Sprite
    state: rotten
    color: lime
  - type: FlavorProfile #imp
    flavors:
    - goblin

- type: entity
  name: raw fish fillet
  parent: FoodMeatBase
  id: FoodCuredCarp
  description: A slice of fresh space fish, safe to eat. Smells like space and fish.
  components:
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Tag
    tags:
    - Raw
    - Meat
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/meat.rsi
    state: cured-carp
  - type: Solution
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 5

# Cooked

- type: entity
  name: honey glazed ham
  parent: FoodMeatBase
  id: FoodMeatGlazedHam
  description: A slow-cooked ham, glazed in caramelized honey and cured with salt.
  components:
  - type: FlavorProfile
    flavors:
    - meat
    - honey
    - salty
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/meat.rsi
    state: honeyglazedham
  - type: SliceableFood
    count: 4
    slice: FoodMeatGlazedHamSlice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 11
      - ReagentId: Protein
        Quantity: 40
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: TableSalt
        Quantity: 5
  - type: Tag
    tags:
    - Meat

- type: entity
  name: honey glazed ham slice
  parent: FoodMeatBase
  id: FoodMeatGlazedHamSlice
  description: A slice of wonderful ham, glazed in delicious honey.
  components:
  - type: FlavorProfile
    flavors:
    - meat
    - honey
    - salty
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.2
      - ReagentId: Protein
        Quantity: 8
      - ReagentId: Vitamin
        Quantity: 1.25
      - ReagentId: TableSalt
        Quantity: 0.625
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/meat.rsi
    layers:
    - state: honeyglazedhamslice
      map: [ "Slice" ]
  - type: RandomSprite
    available:
    - Slice:
        honeyglazedhamslice: ""
        normalhamslice: ""
  - type: Tag
    tags:
    - Slice
    - Meat
